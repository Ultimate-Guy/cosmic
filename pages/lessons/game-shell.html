<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cosmic Game</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#home{position:fixed;top:12px;left:12px;z-index:2147483647;display:block!important;visibility:visible!important;opacity:1!important;padding:9px 15px;border:2px solid #2dccff;border-radius:10px;background:#0d1a21;color:#2dccff;font:700 14px system-ui,sans-serif;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.55)}
#home:hover{background:#16303b}
#home:active{cursor:grabbing}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
<style id="cosmic-recovery-focus-css">
#cosmic-game-recovery{position:fixed;inset:0;z-index:2147483645;display:none;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(45,204,255,.12),transparent 45%),#050c12;color:#f2f7fa;font-family:system-ui,sans-serif;text-align:center}
#cosmic-game-recovery .cgr-card{width:min(560px,94vw);padding:28px;border:1px solid #2dccff;border-radius:22px;background:rgba(7,19,26,.96);box-shadow:0 25px 80px rgba(0,0,0,.6)}
#cosmic-game-recovery h2{color:#2dccff;margin:0 0 10px}#cosmic-game-recovery p{opacity:.8;line-height:1.5}#cosmic-game-recovery button{border:1px solid #2dccff;border-radius:10px;padding:10px 14px;margin:4px;background:rgba(45,204,255,.1);color:#2dccff;cursor:pointer}#cosmic-game-recovery .primary{background:#2dccff;color:#031721;font-weight:800}
</style></head>
<body>
<button id="home" type="button">← Home</button>
<iframe id="game" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
(function(){
  // Compatibility shim used by some legacy UGS exports.
  window.maeExportApis_ = window.maeExportApis_ || function() {};

  const marker='/pages/lessons/';
  const workerHost='cosmicv2.v75ultimate.workers.dev';
  const path=location.pathname||'';
  const index=path.indexOf(marker);
  const prefix=index>=0?path.slice(0,index):(location.hostname.endsWith('.github.io')?'/cosmic':'');
  const shellParams=new URLSearchParams(location.search);
  const requestedHome=shellParams.get('return')||'';
  const defaultHome=location.origin+prefix+marker+'lessons.html';
  let home=defaultHome;
  try{
    const candidate=new URL(requestedHome,location.origin);
    const allowed=candidate.protocol==='https:'&&(
      candidate.hostname===workerHost ||
      (candidate.hostname.endsWith('.github.io')&&candidate.pathname.includes('/cosmic/'))
    );
    if(allowed) home=candidate.href;
  }catch(e){}
  const homeButton=document.getElementById('home');
  const HOME_POS_KEY='cosmicGameHomeButtonPositionV2';
  try{
    const saved=JSON.parse(localStorage.getItem(HOME_POS_KEY)||'null');
    if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){
      const maxLeft=Math.max(0,window.innerWidth-homeButton.offsetWidth);
      const maxTop=Math.max(0,window.innerHeight-homeButton.offsetHeight);
      homeButton.style.left=Math.max(0,Math.min(maxLeft,saved.left))+'px';
      homeButton.style.top=Math.max(0,Math.min(maxTop,saved.top))+'px';
    }
  }catch(e){}
  homeButton.addEventListener('click',function(){
    if(homeButton.dataset.dragged==='1'){homeButton.dataset.dragged='0';return;}
    const destination=new URL(home);
    destination.searchParams.set('fromGame','1');
    try{
      sessionStorage.setItem('cosmicReturnFromGame','1');
      sessionStorage.setItem('cosmicGamesUnlocked','1');
    }catch(e){}
    try{localStorage.setItem('cosmicGamesUnlocked','1');}catch(e){}
    location.assign(destination.href);
  });

  let dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0;
  const stopDragging=()=>{
    if(!dragging)return;
    dragging=false;
    homeButton.style.cursor='grab';
    if(moved){
      homeButton.dataset.dragged='1';
      try{
        localStorage.setItem(HOME_POS_KEY,JSON.stringify({
          left:parseFloat(homeButton.style.left)||0,
          top:parseFloat(homeButton.style.top)||0
        }));
      }catch(e){}
    }
  };
  homeButton.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    const r=homeButton.getBoundingClientRect();
    dragging=true;moved=false;
    startX=e.clientX;startY=e.clientY;
    startLeft=r.left;startTop=r.top;
    homeButton.style.cursor='grabbing';
    try{homeButton.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
    e.stopPropagation();
  });
  homeButton.addEventListener('pointermove',function(e){
    if(!dragging)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved&&(Math.abs(dx)>3||Math.abs(dy)>3))moved=true;
    if(!moved)return;
    const maxLeft=Math.max(0,window.innerWidth-homeButton.offsetWidth);
    const maxTop=Math.max(0,window.innerHeight-homeButton.offsetHeight);
    homeButton.style.left=Math.max(0,Math.min(maxLeft,startLeft+dx))+'px';
    homeButton.style.top=Math.max(0,Math.min(maxTop,startTop+dy))+'px';
    e.preventDefault();
  });
  homeButton.addEventListener('pointerup',function(e){
    if(!dragging)return;
    stopDragging();
    try{homeButton.releasePointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  homeButton.addEventListener('pointercancel',stopDragging);

  function installFramePanic(frame){
    if(!frame)return;
    const bind=()=>{
      try{
        const win=frame.contentWindow;
        if(!win||win.__COSMIC_PANIC_BOUND__)return;
        win.__COSMIC_PANIC_BOUND__=true;
        win.addEventListener('keydown',e=>{
          let key='',url='';
          try{key=localStorage.getItem('cosmic-panic-key')||'';url=localStorage.getItem('cosmic-panic-url')||'';}catch(_){}
          if(!key||!url||e.key!==key)return;
          const t=e.target;
          if(t&&(t.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(t.tagName)))return;
          e.preventDefault();e.stopImmediatePropagation();
          try{window.top.location.assign(url);}catch(_){location.assign(url);}
        },true);
      }catch(_){}
    };
    frame.addEventListener('load',bind,true);
    bind();
  }
  const gameFrame=document.getElementById('game');
  installFramePanic(gameFrame);

  function syncPanicToGame(){
    if(!gameFrame?.contentWindow)return;
    let key='',url='';
    try{
      key=localStorage.getItem('cosmic-panic-key')||'';
      url=localStorage.getItem('cosmic-panic-url')||'';
    }catch(_){}
    try{
      gameFrame.contentWindow.postMessage({type:'cosmic-panic-config',key,url},'*');
    }catch(_){}
  }
  gameFrame?.addEventListener('load',syncPanicToGame,true);
  syncPanicToGame();
  window.addEventListener('storage',e=>{
    if(e.key==='cosmic-panic-key'||e.key==='cosmic-panic-url')syncPanicToGame();
  });

  const params=new URLSearchParams(location.search);
  const game=params.get('game');
  if(!game){location.replace(home);return;}

  function isExternalGameUrl(url){
    return /^https?:\/\//i.test(url.href) && url.hostname!==workerHost;
  }

  function isCosmicGamesCdnUrl(url){
    return url.hostname==='cdn.jsdelivr.net' && /^\/gh\/Ultimate-Guy\/cosmicgames@/i.test(url.pathname);
  }

  async function loadCosmicGamesHtml(url){
    const frame=document.getElementById('game');
    const response=await fetch(url.href,{credentials:'omit',cache:'no-store',redirect:'follow'});
    if(!response.ok) throw new Error('UGS game returned HTTP '+response.status);
    let html=await response.text();
    if(!html.trim()) throw new Error('UGS game returned an empty document');

    // UGS's own launcher fetches the single-file HTML and writes it into a
    // fresh blank document. Match that behavior instead of navigating the
    // iframe directly to the CDN URL.
    if(!/<base\b[^>]*\bhref\s*=|<base\s/i.test(html)){
      const baseTag='<base href="'+new URL('./',url.href).href.replace(/"/g,'&quot;')+'">\n';
      if(/<head\b[^>]*>/i.test(html)){
        html=html.replace(/<head\b[^>]*>/i,'$&\n'+baseTag);
      }else{
        html='<!doctype html><html><head>'+baseTag+'</head><body>'+html+'</body></html>';
      }
    }

    // Keep optional rewarded ads available, but remove explicit forced-ad
    // monetization flags before the UGS document is executed.
    html=html.replace(
      /(<script\b[^>]*\bsrc=["'][^"']*(?:gamesnacks|gamesnacks\.js)[^"']*["'][^>]*)(\/?>)/gi,
      function(_,tag,endTag){
        tag=tag
          .replace(/\sdata-interstitial-monetizable(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?/gi,'')
          .replace(/\sdata-level-complete-monetizable(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?/gi,'')
          .replace(/\sdata-game-over-monetizable(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?/gi,'')
          .replace(/\sdata-run-slotcar-ads-in-game-center(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?/gi,'');
        return tag+endTag;
      }
    );

    const shim='<script>window.maeExportApis_=window.maeExportApis_||function(){};<\/script>\n';
    const policy='<script src="https://cdn.jsdelivr.net/gh/Ultimate-Guy/cosmic@master/scripts/cosmic-ugs-ad-policy.js"><\/script>\n';
    if(/<head\b[^>]*>/i.test(html)){
      html=html.replace(/<head\b[^>]*>/i,'$&\n'+shim+policy);
    }else{
      html=shim+policy+html;
    }

    frame.src='about:blank';
    await new Promise(resolve=>{
      const done=()=>{frame.removeEventListener('load',done);resolve();};
      frame.addEventListener('load',done,{once:true});
      setTimeout(done,500);
    });

    const doc=frame.contentDocument || frame.contentWindow?.document;
    if(!doc) throw new Error('UGS iframe document is unavailable');

    // Mark the route before executing the fetched game document. Some UGS
    // pages run synchronous scripts during document.write(); if one blocks or
    // errors, the parent shell must still know that the target was handed off.
    frame.dataset.cosmicExternalUrl=url.href;
    frame.dataset.cosmicLaunchMode='ugs-document-write';

    doc.open();
    doc.write(html);
    doc.close();
  }

  async function loadExternalHtml(url){
    const response=await fetch(url.href,{credentials:'omit',cache:'no-store',redirect:'follow'});
    if(!response.ok) throw new Error('External game returned HTTP '+response.status);
    const html=await response.text();
    if(!html.trim()) throw new Error('External game returned an empty document');

    const sourceDir=new URL('./',url.href).href;
    const hasBase=/<base\b[^>]*\bhref\s*=|<base\s/i.test(html);
    let documentText=html;
    if(!hasBase){
      const baseTag='<base href="'+sourceDir.replace(/"/g,'&quot;')+'">\\n';
      if(/<head\b[^>]*>/i.test(documentText)){
        documentText=documentText.replace(/<head\b[^>]*>/i,'$&\\n'+baseTag);
      }else{
        documentText='<!doctype html><html><head>'+baseTag+'</head><body>'+documentText+'</body></html>';
      }
    }
    const blob=new Blob([documentText],{type:'text/html;charset=utf-8'});
    const blobUrl=URL.createObjectURL(blob);
    document.getElementById('game').src=blobUrl;
    document.getElementById('game').dataset.cosmicExternalUrl=url.href;
  }

  (async()=>{
    try{
      const url=new URL(game,location.href);
      if(isExternalGameUrl(url)){
        if(isCosmicGamesCdnUrl(url)){
          await loadCosmicGamesHtml(url);
        }else{
          await loadExternalHtml(url);
        }
        return;
      }

      if(url.hostname===workerHost){
        if(url.pathname.endsWith('/')) url.pathname += 'index.html';
        document.getElementById('game').src=url.href;
      }else if(location.hostname.endsWith('.github.io')){
        const canonical=new URL(url.href);
        if(canonical.pathname.startsWith('/cosmic/')){
          canonical.pathname=canonical.pathname.slice('/cosmic'.length);
        }
        canonical.hostname=workerHost;
        canonical.protocol='https:';
        canonical.port='';
        if(canonical.pathname.endsWith('/')) canonical.pathname += 'index.html';
        document.getElementById('game').src=canonical.href;
      }else{
        document.getElementById('game').src=url.href;
      }
    }catch(e){
      console.error('Cosmic game launch failed:',e);
      location.replace(home);
    }
  })();
})();
</script>

<script src="../../scripts/cosmic-wrapper-controls.js?build=wrapper-v4"></script>

<script>
(()=>{try{
  const loadGlobal=()=>{const s=document.createElement('script');s.src='../../scripts/cosmic-global-state.js?v=global-state-v4';s.async=true;document.head.appendChild(s);};
  const loadDev=()=>{if(localStorage.getItem('cosmicCurrentUserV1')!=='TheDevilAngel')return;const s=document.createElement('script');s.src='../../scripts/cosmic-dev-tools.js?build=dev-commands-v5';s.async=true;document.head.appendChild(s);};
  setTimeout(loadGlobal,1800);
  if('requestIdleCallback' in window)requestIdleCallback(loadDev,{timeout:3000});else setTimeout(loadDev,3000);
}catch(_){}})();
</script>
<script>
(function(){
  const frame=document.querySelector('iframe');
  function showRecovery(){
    let box=document.getElementById('cosmic-game-recovery');
    if(!box){
      box=document.createElement('div');box.id='cosmic-game-recovery';
      box.innerHTML='<div class="cgr-card"><h2>Cosmic couldn’t start this game</h2><p>The game may have failed to load. You can retry it, open it in a blank tab, report the issue, or choose another game.</p><button class="primary" id="cgr-retry">Retry</button><button id="cgr-blank">Open Blank</button><button id="cgr-report">Report</button><button id="cgr-another">Try Another</button></div>';
      document.body.appendChild(box);
      box.querySelector('#cgr-retry').onclick=()=>{box.style.display='none';if(frame)frame.src=frame.src;};
      box.querySelector('#cgr-blank').onclick=()=>{if(frame){const w=window.open('about:blank','_blank');if(w)w.location.href=frame.src;}};
      box.querySelector('#cgr-report').onclick=()=>{window.open('https://docs.google.com/forms/d/e/1FAIpQLSfLFwfXdL_Fk8FGAAXPire3yIPX0qIoj3Ua1dAGQsw4pTb98Q/viewform','_blank');};
      box.querySelector('#cgr-another').onclick=()=>{location.href='../lessons.html';};
    }
    box.style.display='grid';
  }
  if(frame){
    const loading=document.createElement('div');
    loading.id='cosmic-game-loading';
    loading.textContent='LOADING GAME…';
    loading.style.cssText='position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#050b10;color:#2dccff;font:800 15px system-ui,sans-serif;letter-spacing:.12em;pointer-events:none;transition:opacity .18s ease;';
    document.body.appendChild(loading);
    frame.addEventListener('load',()=>{loading.style.opacity='0';setTimeout(()=>loading.remove(),220);},{once:true});
  }
})();
</script>
</body>
</html>
