name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
      - name: Inject Game Password
        run: sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py
      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true
      - name: Prepare identical deployment files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='.gitignore' ./ _site/
          cp wrangler.jsonc _site/wrangler.jsonc
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          site=Path('_site')
          lessons=site/'pages/lessons/lessons.html'
          if not lessons.exists(): raise SystemExit('Missing Pages lessons directory')
          required=[
            'cosmic-hub.js?v=3',
            'cosmic-admin-guard.js?v=3',
            'cosmic-launch-fix.js?v=3',
            'cosmic-feedback.js?v=2',
            'cosmic-profile-widget.js?v=2',
          ]
          text=lessons.read_text(encoding='utf-8')
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Generated lessons.html is missing: '+', '.join(missing))

          hub=site/'scripts/cosmic-hub.js'
          registration='navigator.serviceWorker.register'
          owners=[]
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.html','.htm'} or p == hub:
                  continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if registration in value:
                  p.write_text(value.replace(registration,'Promise.resolve'),encoding='utf-8')
          for p in site.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.js','.html','.htm'}:
                  try: count=p.read_text(encoding='utf-8').count(registration)
                  except UnicodeDecodeError: continue
                  if count: owners.append(f'{p.relative_to(site)}:{count}')
          if owners != ['scripts/cosmic-hub.js:1']:
              raise SystemExit(f'Expected only scripts/cosmic-hub.js to register the service worker; found {owners}')

          sw=(site/'sw.js').read_text(encoding='utf-8')
          if "cosmic-shell-v5" not in sw or "cache: 'no-store'" not in sw:
              raise SystemExit('Authoritative sw.js validation failed')
          if any(x in sw for x in ('cosmic-shell-v1','cosmic-shell-v3','cosmic-shell-v4')):
              raise SystemExit('Obsolete cache name remains in sw.js')

          marker={
            'source_commit':'${{ github.sha }}',
            'profile_widget':'scripts/cosmic-profile-widget.js?v=2',
            'service_worker_cache':'cosmic-shell-v5'
          }
          (site/'deployment.json').write_text(json.dumps(marker,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(marker))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload exact build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy exact same build to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '_site'
          command: deploy --config wrangler.jsonc
      - name: Confirm Cloudflare deployment exists
        working-directory: '_site'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name cosmicv2 --config wrangler.jsonc
          echo 'Cloudflare control-plane deployment confirmed.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify GitHub Pages contains this exact build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['PAGES_URL'].rstrip('/')+'/deployment.json'
          expected=os.environ['EXPECTED_COMMIT']
          last=None
          for _ in range(12):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
                  if data.get('source_commit')==expected:
                      print(f'VERIFIED GitHub Pages: {data}')
                      break
                  last=data
              except Exception as exc:
                  last=repr(exc)
              time.sleep(5)
          else:
              raise SystemExit(f'GitHub Pages build mismatch. Expected {expected}, got {last}')
          PY
