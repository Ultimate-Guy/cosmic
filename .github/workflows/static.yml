name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write 
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Kills old builds immediately so the latest game additions go live first
  cancel-in-progress: true 

jobs:
  build:
    runs-on: ubuntu-latest
    # Added a timeout to prevent hanging workflows from wasting time
    timeout-minutes: 5 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Faster: only fetches the last 2 commits instead of the entire history
          fetch-depth: 2 

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Caches pip dependencies if you ever add them to your script
          cache: 'pip' 

      - name: Generate game registry
        # This script must stay efficient as you add "tons of games"
        run: python3 scripts/generate-game-registry.py

      - name: Commit games.json changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of games.json [skip ci]"
          file_pattern: 'pages/lessons/games.json'
          # Prevents the workflow from failing if no new games were actually added
          skip_dirty_check: true 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
