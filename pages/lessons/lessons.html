<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { 
            --accent: #2dccff;
            --bg-dark: #070f15;
            --card-bg: rgba(13, 26, 33, 0.85);
            --border: rgba(58, 204, 255, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-dark);
            /* Space Starfield Background */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            color: #8fecff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Floating Buttons (Top Corners) */
        .floating-nav {
            position: fixed;
            top: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .top-left { left: 20px; }
        .top-right { right: 20px; }

        .in-game-button {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            color: var(--accent);
            backdrop-filter: blur(5px);
        }
        .in-game-button:hover { background: var(--accent); color: #000; transform: scale(1.1); }
        .in-game-button svg { width: 15px; height: 15px; }

        /* Settings Text Button */
        #settings-trigger { font-weight: bold; padding: 10px 20px; }

        /* Game Grid - Fixed Overlapping */
        #main-content { padding: 100px 40px 40px; }
        #gamesgrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        
        .game-card { 
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .game-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 10px; object-fit: cover; }
        .game-thumb-placeholder { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; display: grid; place-items: center; font-size: 0.8rem; }

        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .play-btn { background: var(--accent); color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Full Screen Game Loader */
        #page-loader {
            position: fixed; inset: 0; background: #000;
            display: none; z-index: 500;
        }
        #page-loader iframe { width: 100%; height: 100%; border: none; }

        /* Settings Modal (Glaxyias Inspired) */
        #settings-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; place-items: center; z-index: 2000;
        }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 400px; }
        .option { margin-bottom: 20px; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: var(--accent); border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Top Left Home Button (Always visible) -->
    <div class="floating-nav top-left">
        <button id="gameButton" class="in-game-button" onclick="goHome()">
            <svg viewBox="0 0 320 512"><path fill="currentColor" d="M34.52 239.03L228.87 44.69c9.37-9.37 24.57-9.37 33.94 0l22.67 22.67c9.36 9.36 9.37 24.52.04 33.9L131.49 256l154.02 154.75c9.34 9.38 9.32 24.54-.04 33.9l-22.67 22.67c-9.37 9.37-24.57 9.37-33.94 0L34.52 272.97c-9.37-9.37-9.37-24.57 0-33.94z"></path></svg>
            <img src="../../imgs/cosmic.png" width="30" height="30" alt="Logo" />
        </button>
    </div>

    <!-- Top Right Settings Button -->
    <div class="floating-nav top-right">
        <button id="settings-trigger" class="in-game-button" onclick="toggleSettings()">
            <i class="fas fa-cog"></i> Settings
        </button>
    </div>

    <main id="main-content">
        <div id="gamesgrid">
            <p id="loading">Scanning Cosmic Registry...</p>
        </div>
    </main>

    <section id="page-loader">
        <iframe id="game-iframe"></iframe>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3>Panic & Privacy</h3>
            <div class="option">
                <label>Panic Key</label>
                <input type="text" id="panic-key" placeholder="e.g. \" maxlength="1" />
            </div>
            <div class="option">
                <label>Panic URL</label>
                <input type="text" id="panic-url" placeholder="https://classroom.google.com" />
            </div>
            <button class="play-btn" style="width:100%" onclick="toggleSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        // Core Logic
        function goHome() {
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('game-iframe').src = '';
            document.getElementById('main-content').style.display = 'block';
        }

        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
        }

        // Panic Redirect (Glaxyias style)
        window.addEventListener('keydown', (e) => {
            const key = document.getElementById('panic-key').value || '\\';
            const url = document.getElementById('panic-url').value || 'https://classroom.google.com';
            if (e.key === key) window.location.replace(url);
        });

        // Registry Loading [1, 2]
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const grid = document.getElementById('gamesgrid');
                document.getElementById('loading').remove();
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    
                    const finalUrl = gameUrl(game);
                    const imgUrl = game.image ? gameUrl({path: game.image}) : null;

                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}" class="game-thumb">` : `<div class="game-thumb-placeholder">${game.name}</div>`}
                        <div style="font-weight:bold; font-size:0.9rem">${game.name}</div>
                        <div class="card-actions">
                            <button class="play-btn" onclick="launch('${finalUrl}')">Play</button>
                            <button class="play-btn" style="background:none; border:1px solid var(--accent); color:var(--accent)" onclick="window.open('${finalUrl}', '_blank')">Tab</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });

        function launch(url) {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('page-loader').style.display = 'block';
            document.getElementById('game-iframe').src = url;
        }
    </script>
</body>
</html>
