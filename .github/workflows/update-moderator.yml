name: Dynamic Wordlist Auto-Updater

on:
  schedule:
    # Runs automatically every single day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to click a button in GitHub and trigger it manually

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to push changes to your repository

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Fetch and Inject Dynamic Terminology
        run: |
          # 1. Download a raw list of words from a public source
          # Replace this URL with any raw text list (newline separated terms)
          curl -s "https://githubusercontent.com" > raw_list.txt
          
          # 2. Add your custom specific values to the downloaded list
          echo "proxy" >> raw_list.txt
          echo "games" >> raw_list.txt
          echo "killing" >> raw_list.txt

          # 3. Clean up the words and turn them into a single-line JavaScript Array format
          # This trims white space, ignores empty lines, adds quotes, and joins them with commas
          JS_ARRAY=$(awk 'NF {print "\""$0"\""}' raw_list.txt | paste -sd, -)
          FINAL_LINE="    const DEFAULT_BLOCKLIST = [$JS_ARRAY];"

          # 4. Use sed to replace the row immediately following our anchor placeholder comment
          # This alters the local script file directly inside the GitHub runner environment
          sed -i "/\/\/ DYNAMIC_ARRAY_PLACEHOLDER/{n;s/.*/$FINAL_LINE/;}" scripts/moderator.js

      - name: Commit and Push Changes to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only proceed with saving if changes were actually introduced
          if ! git diff --exit-code scripts/moderator.js; then
            git add scripts/moderator.js
            git commit -m "chore: automated sync of content moderation list [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No new terminology detected. Workspace is clean."
          fi
