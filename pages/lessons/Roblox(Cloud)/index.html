<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Roblox via Cosmic Hub</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ff9d;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        p {
            color: #8a8f98;
            font-size: 0.9rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Bypassing Platforms Filters...</h2>
        <p>Injecting educational partner tokens for Roblox Cloud</p>
    </div>

    <script>
        (function() {
            try {
                // 1. Force state variables into parent and local session storage
                // This tricks the target server into believing it's inside an approved educational portal
                sessionStorage.setItem('isEmbeddedFrame', 'skool');
                sessionStorage.setItem('partnerName', 'skool');
                localStorage.setItem('isEmbeddedFrame', 'skool');
                localStorage.setItem('partnerName', 'skool');
                
                // 2. Clear any active blocked states
                sessionStorage.removeItem('proxy_detected');
            } catch (e) {
                console.error("Storage injection error", e);
            }

            // 3. Define target Roblox application instance routing
            const targetUrl = "https://now.gg";
            const bypassParams = "?utm_source=now.gg-partner&utm_medium=bot&utm_campaign=carl";

            // 4. Force top-level navigation execution to eliminate iframe SAMEORIGIN blocking entirely
            setTimeout(function() {
                window.location.href = targetUrl + bypassParams;
            }, 1200);
        })();
    </script>
</body>
</html>
