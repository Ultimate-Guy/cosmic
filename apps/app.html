<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic App</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131a}#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07131a}.home{position:fixed;top:12px;left:12px;z-index:2147483647;padding:8px 14px;border:2px solid #2dccff;border-radius:10px;background:#0d1a21;color:#2dccff;font:700 14px system-ui,sans-serif;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.55)}.home:hover{background:#16303b}.home:active{cursor:grabbing}.error{position:fixed;inset:0;display:grid;place-items:center;color:#8da2ad;font:14px system-ui,sans-serif;text-align:center;padding:30px}.error b{color:#2dccff}</style></head><body><button class="home" id="home" aria-label="Return to Cosmic apps">← Home</button><iframe id="appframe" allow="fullscreen; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><script>const frame=document.getElementById('appframe');const home=document.getElementById('home');home.addEventListener('click',function(e){if(home.dataset.dragged==='1'){e.preventDefault();home.dataset.dragged='0';return}location.href='apps.html'});let dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0;home.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;const r=home.getBoundingClientRect();dragging=true;moved=false;startX=e.clientX;startY=e.clientY;startLeft=r.left;startTop=r.top;home.style.cursor='grabbing';home.setPointerCapture?.(e.pointerId);e.preventDefault()});home.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(!moved&&(Math.abs(dx)>4||Math.abs(dy)>4))moved=true;if(moved){home.style.left=Math.max(0,Math.min(window.innerWidth-home.offsetWidth,startLeft+dx))+'px';home.style.top=Math.max(0,Math.min(window.innerHeight-home.offsetHeight,startTop+dy))+'px';e.preventDefault()}});home.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;home.style.cursor='grab';if(home.releasePointerCapture?.(e.pointerId)&&home.hasPointerCapture?.(e.pointerId))home.releasePointerCapture(e.pointerId);if(moved)home.dataset.dragged='1'});home.addEventListener('pointercancel',()=>{dragging=false;home.style.cursor='grab'});const params=new URLSearchParams(location.search);const url=params.get('url');if(!url){document.body.insertAdjacentHTML('beforeend','<div class="error"><div><b>Cosmic Apps</b><br>Missing app URL.</div></div>')}else{try{const target=new URL(url,location.href);if(!/^https?:$/.test(target.protocol))throw new Error('Invalid protocol');frame.src=target.href;document.title=params.get('name')||'Cosmic App'}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="error"><div><b>Cosmic Apps</b><br>Invalid app URL.</div></div>')}}</script><script src="../scripts/cosmic-wrapper-controls.js?build=wrapper-v1"></script>
</body></html>
