<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crazy Descent • Cosmic</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#eaf8ff;font-family:system-ui,sans-serif;overflow:hidden}
#cosmic-game{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#bar{position:fixed;top:12px;left:12px;right:12px;z-index:2147483640;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid rgba(45,204,255,.32);border-radius:12px;background:rgba(5,14,21,.92);backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,0,0,.45)}
#bar strong{font-size:.8rem;color:#eaf8ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{border:1px solid #2dccff;border-radius:8px;padding:7px 11px;background:#0d1a21;color:#2dccff;font:700 12px system-ui,sans-serif;cursor:pointer}
#play{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(45,204,255,.08),transparent 42%),#000}
#play button{border:1px solid #2dccff;border-radius:14px;padding:14px 22px;background:#2dccff;color:#031721;font:900 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 28px rgba(45,204,255,.18)}
#frame{display:none;width:100%;height:100%;border:0;background:#000}
#frame.loaded{display:block}
</style>
</head>
<body>
<div id="cosmic-game">
  <div id="bar"><strong>Crazy Descent</strong><button id="home" type="button">← Home</button></div>
  <div id="play"><button id="start" type="button">▶ Play Crazy Descent</button></div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen title="Crazy Descent"></iframe>
</div>
<script>
(() => {
  const gameUrl="https://minigamesville.com/play/crazy-descent/";
  const frame=document.getElementById('frame');
  const play=document.getElementById('play');
  const start=document.getElementById('start');
  start.addEventListener('click',()=>{
    play.remove();
    frame.src=gameUrl;
    frame.classList.add('loaded');
  });
  document.getElementById('home').addEventListener('click',()=>{
    try{sessionStorage.setItem('cosmicReturnFromGame','1')}catch(_){}
    location.href=(location.hostname.endsWith('.github.io')?'/cosmic/':'/')+'pages/lessons/lessons.html';
  });
})();
</script>
<script>
(() => {
  if (window.top !== window) return;
  const root=location.hostname.endsWith('.github.io')?'/cosmic/':'/';
  for(const file of [
    'scripts/game-guard.js?v=guard',
    'scripts/cosmic-wrapper-controls.js?v=wrapper-v5',
    'scripts/cosmic-global-state.js?v=global-state-v5',
    'scripts/cosmic-dev-tools.js?build=dev-commands-v5'
  ]){
    const s=document.createElement('script');s.src=root+file;s.async=false;
    (document.head||document.documentElement).appendChild(s);
  }
})();
</script>

<script src="/scripts/game-guard.js?v=guard"></script>
</body>
</html>
