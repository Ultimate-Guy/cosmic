name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Inject Game Password
        run: |
          sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py

      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true

      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site

          # Stage a separate Pages-only copy. Never modify the source files used
          # by the Cloudflare site.
          rsync -a \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site/pages/lessons')
          if not root.exists():
              raise SystemExit('Missing Pages lessons directory')

          # GitHub Pages is served from /cosmic. Adapt only the deployment copy.
          text_extensions = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.css', '.json', '.svg'
          }
          quoted_root = re.compile(r'(["\'])/(?!/|cosmic/|https?://)')
          css_root = re.compile(r'url\((?![\"\']?//)(?![\"\']?/cosmic/)')
          guard_src = '/cosmic/scripts/game-guard.js?v=pages'
          guard_tag = f'<script id="cosmic-pages-game-guard" src="{guard_src}"></script>'
          smash_guard = '''<script>(function(){\nconst HOME=location.origin+(location.pathname.split('/pages/lessons/')[0]||'/cosmic')+'/pages/lessons/lessons.html';\nfunction add(){if(!document.documentElement)return;let b=document.getElementById('cosmic-smash-home');if(!b){b=document.createElement('button');b.id='cosmic-smash-home';b.type='button';b.textContent='← Home';b.onclick=function(){location.href=HOME};(document.body||document.documentElement).appendChild(b)}b.style.cssText='position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;font:700 14px system-ui,sans-serif!important;cursor:pointer!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important'}\nadd();new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true});})();</script>'''

          changed_files = 0
          changed_games = 0
          guard_injected = 0

          for game_dir in root.iterdir():
              if not game_dir.is_dir() or game_dir.name in {'apps'}:
                  continue
              game_changed = False
              is_smash = game_dir.name.lower() == 'smash karts (may not work at school)'
              for path in game_dir.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_extensions:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue

                  original = text
                  text = quoted_root.sub(r'\1/cosmic/', text)
                  text = css_root.sub('url(/cosmic/', text)

                  if path.name.lower() == 'index.html':
                      if is_smash:
                          # Smash Karts rebuilds its whole document with document.write.
                          # Do not load the generic guard before that replacement: the
                          # generic Document.write/fullscreen hooks can interfere with
                          # its Unity bootstrap. Add a Pages-only Home button after its
                          # document.close() instead, with no source/Cloudflare change.
                          if 'cosmic-smash-home' not in text and 'document.close()' in text:
                              text = text.replace('document.close()', 'document.close();' + smash_guard, 1)
                      elif 'cosmic-pages-game-guard' not in text:
                          if re.search(r'</head>', text, flags=re.IGNORECASE):
                              text = re.sub(r'</head>', guard_tag + '</head>', text, count=1, flags=re.IGNORECASE)
                          else:
                              text = guard_tag + text
                          guard_injected += 1

                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed_files += 1
                      game_changed = True

              if game_changed:
                  changed_games += 1

          print(f'Rewrote Pages resources in {changed_files} files across {changed_games} games')
          print(f'Injected generic Pages Home guard into {guard_injected} game entry pages')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
