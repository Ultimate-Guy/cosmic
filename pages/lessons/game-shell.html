<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cosmic Game</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#home{position:fixed;top:12px;left:12px;z-index:2147483647;display:block!important;visibility:visible!important;opacity:1!important;padding:9px 15px;border:2px solid #2dccff;border-radius:10px;background:#0d1a21;color:#2dccff;font:700 14px system-ui,sans-serif;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.55)}
#home:hover{background:#16303b}
#home:active{cursor:grabbing}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
<style id="cosmic-recovery-focus-css">
#cosmic-game-recovery{position:fixed;inset:0;z-index:2147483645;display:none;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(45,204,255,.12),transparent 45%),#050c12;color:#f2f7fa;font-family:system-ui,sans-serif;text-align:center}
#cosmic-game-recovery .cgr-card{width:min(560px,94vw);padding:28px;border:1px solid #2dccff;border-radius:22px;background:rgba(7,19,26,.96);box-shadow:0 25px 80px rgba(0,0,0,.6)}
#cosmic-game-recovery h2{color:#2dccff;margin:0 0 10px}#cosmic-game-recovery p{opacity:.8;line-height:1.5}#cosmic-game-recovery button{border:1px solid #2dccff;border-radius:10px;padding:10px 14px;margin:4px;background:rgba(45,204,255,.1);color:#2dccff;cursor:pointer}#cosmic-game-recovery .primary{background:#2dccff;color:#031721;font-weight:800}
</style></head>
<body>
<button id="home" type="button">← Home</button>
<iframe id="game" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
(function(){
  const marker='/pages/lessons/';
  const workerHost='cosmicv2.v75ultimate.workers.dev';
  const path=location.pathname||'';
  const index=path.indexOf(marker);
  const prefix=index>=0?path.slice(0,index):(location.hostname.endsWith('.github.io')?'/cosmic':'');
  const home=location.origin+prefix+marker+'lessons.html';
  const homeButton=document.getElementById('home');
  homeButton.addEventListener('click',function(){
    if(homeButton.dataset.dragged==='1'){homeButton.dataset.dragged='0';return;}
    try{sessionStorage.setItem('cosmicReturnFromGame','1');}catch(e){}
    location.assign(home);
  });

  let dragging=false,moved=false,startX=0,startY=0,startLeft=0,startTop=0;
  homeButton.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    const r=homeButton.getBoundingClientRect();
    dragging=true;moved=false;startX=e.clientX;startY=e.clientY;startLeft=r.left;startTop=r.top;
    homeButton.style.cursor='grabbing';
    homeButton.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  homeButton.addEventListener('pointermove',function(e){
    if(!dragging)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!moved&&(Math.abs(dx)>4||Math.abs(dy)>4))moved=true;
    if(moved){
      homeButton.style.left=Math.max(0,Math.min(window.innerWidth-homeButton.offsetWidth,startLeft+dx))+'px';
      homeButton.style.top=Math.max(0,Math.min(window.innerHeight-homeButton.offsetHeight,startTop+dy))+'px';
      e.preventDefault();
    }
  });
  homeButton.addEventListener('pointerup',function(e){
    if(!dragging)return;
    dragging=false;homeButton.style.cursor='grab';
    if(homeButton.releasePointerCapture?.(e.pointerId)&&homeButton.hasPointerCapture?.(e.pointerId))homeButton.releasePointerCapture(e.pointerId);
    if(moved)homeButton.dataset.dragged='1';
  });
  homeButton.addEventListener('pointercancel',function(){dragging=false;homeButton.style.cursor='grab'});

  const params=new URLSearchParams(location.search);
  const game=params.get('game');
  if(!game){location.replace(home);return;}

  try{
    const url=new URL(game,location.href);

    // Cosmic uses the Cloudflare Worker as the canonical game host on both
    // GitHub Pages and Cloudflare. The parent Cosmic shell owns the controls,
    // so games do not need to rewrite their own documents.
    if(url.hostname===workerHost){
      // Cloudflare Static Assets reliably serves explicit files; normalize
      // directory-style game entries to their actual index document.
      if(url.pathname.endsWith('/')) url.pathname += 'index.html';
      document.getElementById('game').src=url.href;
    }else if(location.hostname.endsWith('.github.io')){
      const canonical=new URL(url.href);
      if(canonical.pathname.startsWith('/cosmic/')){
        canonical.pathname=canonical.pathname.slice('/cosmic'.length);
      }
      canonical.hostname=workerHost;
      canonical.protocol='https:';
      canonical.port='';
      if(canonical.pathname.endsWith('/')) canonical.pathname += 'index.html';
      document.getElementById('game').src=canonical.href;
    }else{
      document.getElementById('game').src=url.href;
    }
  }catch(e){location.replace(home);}
})();
</script>
<script src="../../scripts/cosmic-dev-tools.js?build=dev-commands-v5"></script>
<script src="../../scripts/cosmic-wrapper-controls.js?build=wrapper-v4"></script>
<script src="../../scripts/cosmic-global-state.js?v=global-state-v4"></script>
<script>
(function(){
  const frame=document.querySelector('iframe');
  function showRecovery(){
    let box=document.getElementById('cosmic-game-recovery');
    if(!box){
      box=document.createElement('div');box.id='cosmic-game-recovery';
      box.innerHTML='<div class="cgr-card"><h2>Cosmic couldn’t start this game</h2><p>The game may have failed to load. You can retry it, open it in a blank tab, report the issue, or choose another game.</p><button class="primary" id="cgr-retry">Retry</button><button id="cgr-blank">Open Blank</button><button id="cgr-report">Report</button><button id="cgr-another">Try Another</button></div>';
      document.body.appendChild(box);
      box.querySelector('#cgr-retry').onclick=()=>{box.style.display='none';if(frame)frame.src=frame.src;};
      box.querySelector('#cgr-blank').onclick=()=>{if(frame){const w=window.open('about:blank','_blank');if(w)w.location.href=frame.src;}};
      box.querySelector('#cgr-report').onclick=()=>{window.open('https://docs.google.com/forms/d/e/1FAIpQLSfLFwfXdL_Fk8FGAAXPire3yIPX0qIoj3Ua1dAGQsw4pTb98Q/viewform','_blank');};
      box.querySelector('#cgr-another').onclick=()=>{location.href='../lessons.html';};
    }
    box.style.display='grid';
  }
  if(frame){
    const loading=document.createElement('div');
    loading.id='cosmic-game-loading';
    loading.textContent='LOADING GAME…';
    loading.style.cssText='position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#050b10;color:#2dccff;font:800 15px system-ui,sans-serif;letter-spacing:.12em;pointer-events:none;transition:opacity .18s ease;';
    document.body.appendChild(loading);
    frame.addEventListener('load',()=>{loading.style.opacity='0';setTimeout(()=>loading.remove(),220);},{once:true});
  }
})();
</script>
</body>
</html>
