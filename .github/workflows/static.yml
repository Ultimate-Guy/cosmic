name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
    paths:
      - 'pages/lessons/**'
      - 'scripts/generate-game-registry.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # FIX: Sync BEFORE running the Python script
      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # This pulls changes while the workspace is still clean
          git pull --rebase origin master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Now run the script on a clean, up-to-date workspace
      - name: Generate game registry
        run: python3 scripts/generate-game-registry.py

      - name: Commit games.json changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of games.json [skip ci]"
          file_pattern: 'pages/lessons/games.json'
          skip_dirty_check: false 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
