name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Inject Game Password
        run: |
          sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py

      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true

      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a ./. _site/
          rm -rf _site/.git _site/.github _site/.gitignore _site/_site
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site/pages/lessons')
          prefix = '/cosmic/'
          if not root.exists():
              raise SystemExit('Missing Pages lessons directory')

          # GitHub Pages is served from /cosmic, so game pages that contain
          # root-relative resource URLs need those URLs to stay inside the
          # project. This only changes the Pages build copy; the Cloudflare
          # files in the repository are left untouched.
          patterns = [
              (re.compile(r'(["\'])/(?!/|cosmic/|https?://)'), r'\1/cosmic/'),
              (re.compile(r'url\(/(?!/|cosmic/)'), 'url(/cosmic/'),
          ]
          changed = 0
          for page in root.glob('*/index.html'):
              text = page.read_text(encoding='utf-8')
              original = text
              for pattern, replacement in patterns:
                  text = pattern.sub(replacement, text)
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'Rewrote root-relative game resources in {changed} Pages game pages')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
