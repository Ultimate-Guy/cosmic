name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
      - name: Inject Game Password
        run: |
          sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py
      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true
      - name: Prepare identical deployment files
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='.gitignore' ./ _site/
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('_site/pages/lessons')
          if not root.exists(): raise SystemExit('Missing Pages lessons directory')
          text_extensions={'.html','.htm','.css','.svg'}
          html_root=re.compile(r'(\b(?:src|href|action|poster|data-src|data-url)\s*=\s*["\'])/(?!/|cosmic/|https?://)',re.I)
          css_root=re.compile(r'url\((?!["\']?//)(?!["\']?/cosmic/)')
          normal_guard='''<script id="cosmic-pages-home-inline">(function(){function home(){var p=location.pathname,m='/pages/lessons/',i=p.indexOf(m);return location.origin+(i>=0?p.slice(0,i):'/cosmic')+m+'lessons.html'}function add(){if(!document.documentElement)return;var b=document.getElementById('cosmic-pages-home-inline-button');if(!b){b=document.createElement('button');b.id='cosmic-pages-home-inline-button';b.type='button';b.textContent='← Home';b.onclick=function(e){if(b.__dragged){e.preventDefault();b.__dragged=false;return}location.href=home()};(document.body||document.documentElement).appendChild(b);var dragging=false,moved=false,sx=0,sy=0,sl=0,st=0;b.style.cssText='position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;font:700 14px system-ui,sans-serif!important;cursor:grab!important;user-select:none!important;touch-action:none!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important';b.addEventListener('pointerdown',function(e){if(e.button!==undefined&&e.button!==0)return;var r=b.getBoundingClientRect();dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;b.style.cursor='grabbing';b.setPointerCapture?.(e.pointerId);e.preventDefault()});b.addEventListener('pointermove',function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&(Math.abs(dx)>4||Math.abs(dy)>4))moved=true;if(moved){b.style.left=Math.max(0,Math.min(innerWidth-b.offsetWidth,sl+dx))+'px';b.style.top=Math.max(0,Math.min(innerHeight-b.offsetHeight,st+dy))+'px';e.preventDefault()}});b.addEventListener('pointerup',function(e){if(!dragging)return;dragging=false;b.style.cursor='grab';if(b.releasePointerCapture?.(e.pointerId)&&b.hasPointerCapture?.(e.pointerId))b.releasePointerCapture(e.pointerId);if(moved)b.__dragged=true});b.addEventListener('pointercancel',function(){dragging=false;b.style.cursor='grab'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});else add();})();</script>'''
          smash_guard='''<script>(function(){function home(){var p=location.pathname,m='/pages/lessons/',i=p.indexOf(m);return location.origin+(i>=0?p.slice(0,i):'/cosmic')+m+'lessons.html'}function add(){if(!document.documentElement)return;var b=document.getElementById('cosmic-smash-home');if(!b){b=document.createElement('button');b.id='cosmic-smash-home';b.type='button';b.textContent='← Home';b.style.cssText='position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;font:700 14px system-ui,sans-serif!important;cursor:grab!important;user-select:none!important;touch-action:none!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important';(document.body||document.documentElement).appendChild(b);var dragging=false,moved=false,sx=0,sy=0,sl=0,st=0;b.addEventListener('pointerdown',function(e){if(e.button!==undefined&&e.button!==0)return;var r=b.getBoundingClientRect();dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=r.left;st=r.top;b.style.cursor='grabbing';b.setPointerCapture?.(e.pointerId);e.preventDefault()});b.addEventListener('pointermove',function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&(Math.abs(dx)>4||Math.abs(dy)>4))moved=true;if(moved){b.style.left=Math.max(0,Math.min(innerWidth-b.offsetWidth,sl+dx))+'px';b.style.top=Math.max(0,Math.min(innerHeight-b.offsetHeight,st+dy))+'px';e.preventDefault()}});b.addEventListener('pointerup',function(e){if(!dragging)return;dragging=false;b.style.cursor='grab';if(b.releasePointerCapture?.(e.pointerId)&&b.hasPointerCapture?.(e.pointerId))b.releasePointerCapture(e.pointerId);if(!moved)location.href=home()});b.addEventListener('pointercancel',function(){dragging=false;b.style.cursor='grab'})}add();})();</script>'''
          literal=json.dumps(smash_guard)[1:-1].replace('</script>','<\\/script>')
          marker='\\r\\n<\\/body>\\r\\n<\\/html>");'
          for game_dir in root.iterdir():
            if not game_dir.is_dir() or game_dir.name=='apps': continue
            smash=game_dir.name.lower()=='smash karts (may not work at school)'
            for path in game_dir.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_extensions: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              original=text
              text=html_root.sub(r'\1/cosmic/',text); text=css_root.sub('url(/cosmic/',text)
              if path.name.lower()=='index.html':
                text=re.sub(r'<script id="cosmic-pages-game-guard"[^>]*></script>','',text,flags=re.I)
                text=re.sub(r'<script id="cosmic-smash-home"[^>]*>.*?</script>','',text,flags=re.I|re.S)
                text=re.sub(r'<script id="cosmic-pages-home-inline"[^>]*>.*?</script>','',text,flags=re.I|re.S)
                if smash and 'cosmic-smash-home' not in text and marker in text: text=text.replace(marker,'\\r\\n'+literal+'\\r\\n<\\/body>\\r\\n<\\/html>");',1)
                elif not smash and 'cosmic-pages-home-inline' not in text: text=re.sub(r'</body>',normal_guard+'</body>',text,count=1,flags=re.I) if re.search(r'</body>',text,re.I) else text+normal_guard
              if text!=original: path.write_text(text,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy the exact same build to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '_site'
          command: deploy
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
