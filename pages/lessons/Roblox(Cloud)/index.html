<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Hub - Stream Router</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            text-align: center;
            padding: 40px;
            background: #1f212a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .launch-btn {
            background: #00ff9d;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .launch-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Local Cloud Sandbox</h2>
        <p style="color: #858994; margin-bottom: 20px;">Routing Roblox instances natively through local repository variables.</p>
        <button class="launch-btn" onclick="initSandbox()">Initialize Sandbox</button>
    </div>

    <script>
        function initSandbox() {
            // Establish authorized session scopes first
            sessionStorage.setItem('isEmbeddedFrame', 'skool');
            sessionStorage.setItem('partnerName', 'skool');

            // Register your internal worker engine to mask outward calls
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('../../../cosmic-sw.js')
                .then(() => {
                    // Open a clean blank screen tab
                    const sandbox = window.open('about:blank', '_blank');
                    
                    // Force inject a hidden local target capture window
                    sandbox.document.write(`
                        <html>
                        <head><title>Roblox Console Instance</title></head>
                        <body style="margin:0;padding:0;background:#000;overflow:hidden;">
                            <iframe src="https://now.gg" style="width:100%;height:100%;border:none;"></iframe>
                        </body>
                        </html>
                    `);
                    sandbox.document.close();
                })
                .catch(err => alert("Proxy registration failed: " + err));
            }
        }
    </script>
</body>
</html>
