<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Hub - Roblox Terminal</title>
    <style>
        body {
            background-color: #0c0d12;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #14161f;
            border-radius: 16px;
            border: 1px solid #232635;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-launch {
            background: linear-gradient(135deg, #00ff9d 0%, #00bfff 100%);
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }
        h2 { margin-bottom: 6px; font-weight: 500; }
        p { color: #828795; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Roblox Cloud Router</h2>
        <p>Generates an isolated clean-room tab to bypass Linewize policies.</p>
        <button class="btn-launch" onclick="launchBypass()">Launch Roblox</button>
    </div>

    <script>
        function launchBypass() {
            // 1. Establish custom partner session identifiers locally first
            try {
                sessionStorage.setItem('isEmbeddedFrame', 'skool');
                sessionStorage.setItem('partnerName', 'skool');
            } catch(e) {}

            // 2. Spawn a completely blank web document instance
            const cleanWindow = window.open('about:blank', '_blank');
            if (!cleanWindow) {
                alert('Pop-up blocked! Please click the pop-up icon in your URL bar and allow them for this site.');
                return;
            }

            // 3. Craft the isolated application layout content body
            const appLayout = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Roblox Game Stream</title>
                    <style>
                        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
                        iframe { width: 100%; height: 100%; border: none; }
                    </style>
                </head>
                <body>
                    <iframe src="https://nowgg.fun"></iframe>
                </body>
                </html>
            `;

            // 4. Force-inject the layout directly into the empty domain context
            cleanWindow.document.write(appLayout);
            cleanWindow.document.close();
        }
    </script>
</body>
</html>
