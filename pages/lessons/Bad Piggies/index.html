<!DOCTYPE html>
<html lang="en-us">

<head>
<base href="https://cdn.jsdelivr.net/gh/67-Factory/web-ports@main/badpiggies/">
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Unity WebGL Player | Bad Piggies</title>
	<link rel="shortcut icon" href="TemplateData/favicon.ico">
	<link rel="stylesheet" href="TemplateData/style.css">
	
</head>

<body style="background-color:black;">
	<div class="webgl-content">
		<div id="gameContainer"></div>
<script src="TemplateData/UnityProgress.js"></script>
	<script src="Build/UnityLoader.js"></script>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.webgl-content {
			width: 100%;
			height: 100%;
		}

		#gameContainer {
			width: 100vw;
			height: 100vh;
		}
	</style>
	<script>
		var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Bad Piggies.json", {
			onProgress: UnityProgress
		});
	</script>
	</div>

<script id="cosmic-game-runtime-loader">
(() => {
  const root = location.hostname.endsWith('.github.io') ? '/cosmic/' : '/';
  const files = [
    'scripts/game-guard.js?v=guard',
    'scripts/cosmic-wrapper-controls.js?v=wrapper-v5',
    'scripts/cosmic-global-state.js?v=global-state-v5',
    'scripts/cosmic-dev-tools.js?build=dev-commands-v5'
  ];
  for (const file of files) {
    const script = document.createElement('script');
    script.src = root + file;
    script.async = false;
    (document.body || document.documentElement).appendChild(script);
  }
})();
</script>
</body>

</html>
