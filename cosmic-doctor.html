<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Doctor</title><style>:root{--a:#2dccff;--line:rgba(45,204,255,.25);--muted:#88a0ac}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(45,204,255,.08),transparent 30%),linear-gradient(145deg,#050c12,#091720);color:#eef8fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:rgba(5,12,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}h1{margin:0;color:var(--a);font-size:1rem;letter-spacing:.12em;text-transform:uppercase}header p{margin:3px 0 0;color:var(--muted);font-size:.68rem}.actions{display:flex;gap:7px}.btn{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#071a24;color:#8ee8ff;font-weight:700;cursor:pointer}.btn.primary{background:var(--a);color:#031721;border-color:var(--a)}main{max-width:1100px;margin:0 auto;padding:18px}.doctor-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.doctor-stats>div,.doctor-summary-card{padding:14px;border:1px solid var(--line);border-radius:13px;background:rgba(7,19,26,.85)}.doctor-stats b{display:block;font-size:1.2rem;color:var(--a)}.doctor-stats span{font-size:.66rem;color:var(--muted)}.doctor-row{margin:8px 0;padding:12px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;background:rgba(7,19,26,.82)}.doctor-row.ok{border-left-color:#39d9a0}.doctor-row.warn{border-left-color:#ffbf66}.doctor-row.bad{border-left-color:#ff6464}.doctor-row>div{display:flex;justify-content:space-between;gap:10px}.doctor-row small,.doctor-row p{display:block;margin:4px 0 0;color:var(--muted);font-size:.68rem}.doctor-clean{padding:18px;border:1px solid rgba(57,217,160,.35);border-radius:13px;background:rgba(57,217,160,.05)}.doctor-clean span{display:block;color:var(--muted);margin-top:4px;font-size:.72rem}@media(max-width:700px){.doctor-stats{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}}</style>
<script src="scripts/cosmic-panic.js?v=panic-v1"></script>
</head><body><header><div><h1>Cosmic Doctor</h1><p>Registry and asset health • Developer access only</p></div><div class="actions"><button class="btn primary" id="doctor-run">Run checks</button><button class="btn" id="doctor-export">Export report</button><button class="btn" onclick="history.back()">Back</button></div></header><main><section id="doctor-summary"></section><section id="doctor-results" style="margin-top:10px"></section></main><script src="./scripts/cosmic-doctor.js"></script><script src="./scripts/cosmic-global-state.js?v=global-state"></script>
</body></html>
