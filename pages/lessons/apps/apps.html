<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Apps</title>
<link rel="stylesheet" href="../../../css/fontawesome.css"><link rel="stylesheet" href="../../../css/otherpages.css">
<style>
:root{--card-bg:rgba(6,20,16,.76);--accent:#2dccff;--card-border:rgba(45,204,255,.42)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070f15;color:#f0f4f8;font-family:system-ui,sans-serif}#top-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:15px 40px;background:rgba(13,26,33,.95);border-bottom:1px solid var(--card-border);position:sticky;top:0;z-index:10}.brand{margin-right:auto;display:flex;align-items:center;gap:12px}.brand img{width:45px;height:45px}.brand h1{margin:0;font-size:2rem;letter-spacing:4px;color:var(--accent);text-shadow:0 0 10px var(--accent)}.nav-btn{background:transparent;border:1px solid var(--card-border);color:var(--accent);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700}.nav-btn:hover{background:rgba(45,204,255,.12)}main{padding:25px 40px 50px}#appsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.app-card{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--card-bg);border:1px solid var(--card-border);box-shadow:0 8px 24px rgba(0,0,0,.35)}.app-title{min-height:2.4em;display:grid;place-items:center;text-align:center;font-weight:700}.open-btn{width:100%;height:38px;border:none;border-radius:999px;background:var(--accent);color:#031721;cursor:pointer;font-weight:800}
</style></head><body>
<header id="top-bar"><div class="brand"><img src="../../../imgs/cosmic.png" alt="Cosmic"><h1>Cosmic</h1></div><button class="nav-btn" onclick="window.location.href='../lessons.html'">Games</button><button class="nav-btn" aria-current="page">Apps</button><button class="nav-btn" onclick="alert('Settings coming soon!')">Settings</button></header>
<main><div id="appsgrid"><p>Connecting to App Registry...</p></div></main>
<script>
function appUrl(app){return new URL(app.path+(app.entry||''),window.location.href).href;}
fetch('apps.json').then(r=>{if(!r.ok)throw new Error('Could not load apps.json');return r.json();}).then(apps=>{const grid=document.getElementById('appsgrid');grid.innerHTML='';apps.forEach(app=>{const card=document.createElement('article');card.className='app-card';const title=document.createElement('div');title.className='app-title';title.textContent=app.name;const button=document.createElement('button');button.className='open-btn';button.textContent='Open';button.onclick=()=>window.location.href=appUrl(app);card.append(title,button);grid.appendChild(card);});if(!apps.length)grid.innerHTML='<p>No apps have been added yet.</p>';}).catch(e=>{document.getElementById('appsgrid').textContent='App Registry error: '+e.message;});
</script></body></html>
