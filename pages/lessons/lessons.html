<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { 
            --accent: #2dccff;
            --bg-dark: #070f15;
            --card-bg: rgba(13, 26, 33, 0.85);
            --border: rgba(58, 204, 255, 0.4);
            --text: #8fecff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-dark);
            /* Space Theme Starfield */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            color: var(--text);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --- Top Bar --- */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 26, 33, 0.9);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        #top-bar h1 {
            margin: 0;
            font-size: 3rem; /* Big Cosmic Font */
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(45, 204, 255, 0.6);
        }

        .settings-nav { display: flex; gap: 20px; }
        .settings-btn { 
            background: none; border: none; color: var(--accent); 
            font-weight: bold; cursor: pointer; font-size: 1rem; 
        }
        .settings-btn:hover { color: #fff; text-decoration: underline; }

        /* --- Floating Home Button (Glaxyias Style) --- */
        #back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: none; /* Only shows during gameplay */
            background: transparent;
            border: 2px solid var(--accent); /* Blue border as requested */
            border-radius: 8px;
            padding: 8px 15px;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: none;
            backdrop-filter: blur(5px);
        }
        #back-home-btn:hover { background: var(--accent); color: #000; }

        /* --- Main Content & Grid --- */
        #main-content { padding: 40px; }
        #gamesgrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
        }
        
        .game-card { 
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px; display: flex;
            flex-direction: column; gap: 8px; text-align: center;
        }

        .game-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 10px; object-fit: cover; }
        .game-thumb-placeholder { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; display: grid; place-items: center; color: var(--accent); font-size: 0.8rem; }

        .play-btn { 
            background: var(--accent); color: #000; border: none; padding: 10px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto;
        }

        /* --- Full Screen Game Loader --- */
        #page-loader {
            position: fixed; inset: 0; background: #000;
            display: none; z-index: 500;
        }
        #page-loader iframe { width: 100%; height: 100%; border: none; }

        /* --- Settings Modal --- */
        #settings-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; place-items: center; z-index: 2000;
        }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 400px; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: var(--accent); border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>

    <!-- Top Bar with Big Title and Settings Triggers -->
    <header id="top-bar">
        <h1>Cosmic</h1>
        <nav class="settings-nav">
            <button class="settings-btn" onclick="toggleSettings()">Panic Settings</button>
            <button class="settings-btn" onclick="maskTab('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png')">Classroom Mask</button>
            <button class="settings-btn" onclick="maskTab('Google', 'https://www.google.com/favicon.ico')">Google Mask</button>
        </nav>
    </header>

    <!-- Floating Home Button (Visible when playing) -->
    <button id="back-home-btn" onclick="goHome()">
        ← Home
    </button>

    <main id="main-content">
        <div id="gamesgrid">
            <p id="loading">Syncing Registry...</p>
        </div>
    </main>

    <section id="page-loader">
        <iframe id="game-iframe"></iframe>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color:var(--accent); margin-top:0;">Panic Override</h3>
            <label>Panic Key</label>
            <input type="text" id="panic-key" placeholder="e.g. \" maxlength="1" />
            <label>Panic URL</label>
            <input type="text" id="panic-url" placeholder="https://classroom.google.com" />
            <button class="play-btn" style="width:100%" onclick="toggleSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        // UI Navigation Logic
        function launch(url) {
            document.getElementById('top-bar').style.display = 'none';      // Hide Top Bar
            document.getElementById('main-content').style.display = 'none'; // Hide Grid
            document.getElementById('page-loader').style.display = 'block'; // Show Game
            document.getElementById('back-home-btn').style.display = 'block'; // Show Floating Home
            document.getElementById('game-iframe').src = url;
        }

        function goHome() {
            document.getElementById('top-bar').style.display = 'flex';      // Show Top Bar
            document.getElementById('main-content').style.display = 'block'; // Show Grid
            document.getElementById('page-loader').style.display = 'none';   // Hide Game
            document.getElementById('back-home-btn').style.display = 'none'; // Hide Floating Home
            document.getElementById('game-iframe').src = '';
        }

        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
        }

        // Privacy Logic (Glaxyias Inspired)
        function maskTab(title, icon) {
            document.title = title;
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon'; link.rel = 'shortcut icon'; link.href = icon;
            document.getElementsByTagName('head').appendChild(link);
        }

        window.addEventListener('keydown', (e) => {
            const key = document.getElementById('panic-key').value || '\\';
            const url = document.getElementById('panic-url').value || 'https://classroom.google.com';
            if (e.key === key) window.location.replace(url);
        });

        // Cosmic Registry Implementation [1, 2]
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const grid = document.getElementById('gamesgrid');
                document.getElementById('loading').remove();
                games.forEach(game => {
                    const card = document.createElement('article');
                    card.className = 'game-card';
                    const finalUrl = gameUrl(game);
                    const imgUrl = game.image ? gameUrl({path: game.image}) : null;

                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}" class="game-thumb">` : `<div class="game-thumb-placeholder">${game.name}</div>`}
                        <div style="font-weight:bold; font-size:0.9rem">${game.name}</div>
                        <button class="play-btn" onclick="launch('${finalUrl}')">Play</button>
                    `;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
