<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        /* --- Original Style Specs --- */
        :root { 
            --card-bg: rgba(6, 20, 16, 0.76); 
            --card-border: rgba(110, 255, 201, 0.42); 
            --card-hover: rgba(127, 255, 212, 0.16); 
            --accent: #2dccff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #070f15;
            color: #8fecff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --- Centered Top Bar with Logo --- */
        #top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 40px;
            background: rgba(13, 26, 33, 0.9);
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand h1 { margin: 0; font-size: 2.8rem; letter-spacing: 5px; color: var(--accent); text-transform: uppercase; }

        .settings-trigger {
            position: absolute; right: 30px; background: transparent; 
            border: 1px solid var(--card-border); color: var(--accent);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
        }

        /* --- Floating Home Button (Glaxyias Style) --- */
        #back-home-btn {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            display: none; background: transparent; border: 1.5px solid var(--accent);
            border-radius: 6px; padding: 5px 10px; color: var(--accent);
            font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }

        /* --- Original Grid Specs --- */
        #main-content { padding: 40px; }
        #gamesgrid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 14px; width: 100%;
        }
        .game-card { 
            display: flex; flex-direction: column; gap: 8px; padding: 10px; 
            border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border); 
        }
        .game-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 12px; object-fit: cover; }
        .game-title { font-size: 0.85rem; text-align: center; min-height: 2.2em; display: grid; place-items: center; }

        /* --- Restored Original Button Sizes --- */
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .play-btn, .blank-btn { 
            width: 100%; height: 36px; font-size: 0.72rem; 
            border-radius: 999px; padding: 0; font-weight: bold; cursor: pointer;
        }
        .play-btn { background: var(--accent); color: #031721; border: none; }
        .blank-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* --- Full Screen Loader --- */
        #page-loader { position: fixed; inset: 0; background: #000; display: none; z-index: 500; }
        #page-loader iframe { width: 100%; height: 100%; border: none; }

        /* --- Settings Modal --- */
        #settings-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; place-items: center; z-index: 2000;
        }
        .modal-content { background: #0d1a21; border: 1px solid var(--card-border); padding: 25px; border-radius: 15px; width: 350px; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--card-border); color: var(--accent); border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="brand">
            <img src="../../imgs/cosmic.png" width="40" height="40" alt="Logo" />
            <h1>Cosmic</h1>
        </div>
        <button class="settings-trigger" onclick="toggleSettings()">Settings</button>
    </header>

    <button id="back-home-btn" onclick="goHome()">← Home</button>

    <main id="main-content">
        <div id="gamesgrid"><p id="loading">Loading games...</p></div>
    </main>

    <section id="page-loader"><iframe id="game-iframe" allowfullscreen></iframe></section>

    <!-- Settings Modal (Functional) -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color:var(--accent); margin-top:0;">Cosmic Settings</h3>
            <label>Panic Key</label>
            <input type="text" id="panic-key" placeholder="Default: \" maxlength="1" />
            <label>Panic URL</label>
            <input type="text" id="panic-url" placeholder="https://classroom.google.com" />
            <label>Tab Masking</label>
            <button class="play-btn" style="height:38px; width:100%; margin-bottom:5px" onclick="mask('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png')">Classroom</button>
            <button class="play-btn" style="height:38px; width:100%" onclick="mask('Google', 'https://www.google.com/favicon.ico')">Google</button>
            <button class="play-btn" style="width:100%; height:45px; margin-top:15px" onclick="toggleSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        // --- Original Pathing & Loading Logic ---
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        function launch(url) {
            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('page-loader').style.display = 'block';
            document.getElementById('back-home-btn').style.display = 'block';
            document.getElementById('game-iframe').src = url;
        }

        function goHome() {
            document.getElementById('top-bar').style.display = 'flex';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('back-home-btn').style.display = 'none';
            document.getElementById('game-iframe').src = '';
        }

        function openBlank(url) {
            const win = window.open('about:blank', '_blank');
            if (!win) return;
            win.document.write('<!DOCTYPE html><html><body style="margin:0;background:#000;"><iframe src="'+url+'" style="border:none;width:100vw;height:100vh;" allowfullscreen></iframe></body></html>');
            win.document.close();
        }

        // --- Settings Functionality ---
        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
        }

        function mask(t, i) {
            document.title = t;
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon'; link.rel = 'shortcut icon'; link.href = i;
            document.getElementsByTagName('head').appendChild(link);
        }

        window.addEventListener('keydown', (e) => {
            const pk = document.getElementById('panic-key').value || '\\';
            const pu = document.getElementById('panic-url').value || 'https://classroom.google.com';
            if (e.key === pk) window.location.replace(pu);
        });

        // --- Original Registry Fetch ---
        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const grid = document.getElementById('gamesgrid');
                document.getElementById('loading').remove();
                games.forEach(game => {
                    const card = document.createElement('article');
                    card.className = 'game-card';
                    const finalUrl = gameUrl(game);
                    const imgPath = game.image ? gameUrl({path: game.image}) : null;

                    card.innerHTML = `
                        ${imgPath ? `<img src="${imgPath}" class="game-thumb">` : `<div class="game-thumb-placeholder">${game.name}</div>`}
                        <div class="game-title">${game.name}</div>
                        <div class="card-actions">
                            <button class="play-btn" onclick="launch('${finalUrl}')">Play</button>
                            <button class="blank-btn" onclick="openBlank('${finalUrl}')">Blank</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
