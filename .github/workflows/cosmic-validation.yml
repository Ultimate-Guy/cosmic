name: Cosmic validation
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate registries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for f in [Path('pages/lessons/games.json'), Path('apps/apps.json')]:
              data=json.loads(f.read_text())
              assert isinstance(data,list), f'{f} must contain an array'
              names=[str(x.get('name','')).strip().lower() for x in data]
              assert all(names), f'{f} contains an item without a name'
              assert len(names)==len(set(names)), f'{f} contains duplicate names'
          print('Cosmic registries are valid.')
          PY
      - name: Check core files
        run: |
          test -f index.html
          test -f cosmic-hub.html
          test -f cosmic-hub.css
          test -f pages/lessons/lessons.html
          test -f pages/lessons/game-shell.html
          echo "Core Cosmic files are present."

  browser-smoke:
    name: Browser game smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Test game directly and through shell
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const { execFileSync } = require('child_process');
          const chrome = execFileSync('bash',['-lc','command -v google-chrome || command -v chromium || command -v chromium-browser']).toString().trim();
          const game = 'https://cosmicv2.v75ultimate.workers.dev/pages/lessons/Snow%20Rider%203D/index.html';
          const shell = 'https://ultimate-guy.github.io/cosmic/pages/lessons/game-shell.html?game=' + encodeURIComponent(game);
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});
            async function inspect(url,label){
              const page=await browser.newPage({viewport:{width:1365,height:768}});
              const errors=[], pageErrors=[], failed=[], responses=[];
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(e.message));
              page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
              page.on('response',r=>{if(/SnowRider3D|UnityLoader|cdn.jsdelivr|index\.html/i.test(r.url())) responses.push({url:r.url(),status:r.status(),type:r.headers()['content-type']||''});});
              let navStatus=null;
              try{const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000}); navStatus=resp?.status()||null;}catch(e){pageErrors.push('NAVIGATION: '+e.message);}
              await page.waitForTimeout(10000);
              const state=await page.evaluate(()=>({href:location.href,title:document.title,bodyText:(document.body?.innerText||'').slice(0,1200),canvasCount:document.querySelectorAll('canvas').length,canvases:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,display:getComputedStyle(c).display,visibility:getComputedStyle(c).visibility}))}));
              console.log(JSON.stringify({label,url,navStatus,state,errors,pageErrors,failed,responses},null,2));
              await page.close();
            }
            try{await inspect(game,'DIRECT_GAME');await inspect(shell,'GAME_SHELL');}
            finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
