name: Cosmic validation

on:
  workflow_run:
    workflows: ["Deploy static content to pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      audit_gfiles:
        description: "Also audit the private gfiles through gfiles5 sources"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Validate Cosmic and deployed game iframes
    runs-on: ubuntu-26.04
    timeout-minutes: 26
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate registries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for f in [Path('pages/lessons/games.json'), Path('apps/apps.json')]:
              data=json.loads(f.read_text())
              assert isinstance(data,list), f'{f} must contain an array'
              names=[str(x.get('name','')).strip().lower() for x in data]
              assert all(names), f'{f} contains an item without a name'
              assert len(names)==len(set(names)), f'{f} contains duplicate names'
          print('Cosmic registries are valid.')
          PY

      - name: Check core files
        run: |
          test -f index.html
          test -f cosmic-hub.html
          test -f cosmic-hub.css
          test -f pages/lessons/lessons.html
          test -f pages/lessons/game-shell.html
          echo "Core Cosmic files are present."

      - name: Validate all original games
        run: python3 scripts/validate-games.py

      - name: Checkout gfiles
        if: ${{ inputs.audit_gfiles }}
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Guy/gfiles
          ref: main
          token: ${{ secrets.GFILES_READ_TOKEN }}
          path: .gfiles/gfiles
          fetch-depth: 1

      - name: Checkout gfiles2
        if: ${{ inputs.audit_gfiles }}
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Guy/gfiles2
          ref: main
          token: ${{ secrets.GFILES_READ_TOKEN }}
          path: .gfiles/gfiles2
          fetch-depth: 1

      - name: Checkout gfiles3
        if: ${{ inputs.audit_gfiles }}
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Guy/gfiles3
          ref: main
          token: ${{ secrets.GFILES_READ_TOKEN }}
          path: .gfiles/gfiles3
          fetch-depth: 1

      - name: Checkout gfiles4
        if: ${{ inputs.audit_gfiles }}
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Guy/gfiles4
          ref: main
          token: ${{ secrets.GFILES_READ_TOKEN }}
          path: .gfiles/gfiles4
          fetch-depth: 1

      - name: Checkout gfiles5
        if: ${{ inputs.audit_gfiles }}
        uses: actions/checkout@v4
        with:
          repository: Ultimate-Guy/gfiles5
          ref: main
          token: ${{ secrets.GFILES_READ_TOKEN }}
          path: .gfiles/gfiles5
          fetch-depth: 1

      - name: Audit gfiles sources
        if: ${{ inputs.audit_gfiles }}
        run: python3 scripts/audit-gfiles.py

      - name: Upload gfiles audit report
        if: ${{ inputs.audit_gfiles }}
        uses: actions/upload-artifact@v4
        with:
          name: gfiles-audit-report
          path: gfiles-audit-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify Cosmic Cloud API
        env:
          COSMIC_API_ORIGIN: https://cosmicv2.v75ultimate.workers.dev
        run: |
          set -euo pipefail
          body="$(mktemp)"
          url="$COSMIC_API_ORIGIN/api/cosmic-profile?username=__cosmic_validation__&account_token=__cosmic_validation__"
          status="$(curl -sS -o "$body" -w "%{http_code}" "$url")"
          type="$(curl -sSI "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')"
          echo "Cosmic Cloud API status: $status"
          echo "Cosmic Cloud API content-type: $type"
          cat "$body"
          test "$status" = "401"
          echo "$type" | grep -q "application/json"
          python3 - "$body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data=json.load(fh)
          assert data.get('ok') is False, data
          assert data.get('error') == 'unauthorized', data
          print('Cosmic Cloud API smoke test passed.')
          PY

      - name: Install browser test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1

      - name: Verify live deployment and test every game target
        env:
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          COSMIC_DEPLOYMENT_WAIT: "30000"
          COSMIC_GAME_HTTP_TIMEOUT: "5000"
          COSMIC_TARGET_CONCURRENCY: "48"
          COSMIC_BROWSER_CONCURRENCY: "8"
          COSMIC_GAME_NAV_TIMEOUT: "5000"
          COSMIC_GAME_FRAME_WAIT: "5000"
          COSMIC_GAME_LOAD_WAIT: "500"
          COSMIC_BROWSER_SAMPLE: "12"
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node scripts/validate-game-iframes.mjs
