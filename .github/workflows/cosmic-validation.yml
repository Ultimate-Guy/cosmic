name: Cosmic validation\non:\n  push:\n    branches: ["master"]\n  pull_request:\n    branches: ["master"]\n  workflow_dispatch:\n  workflow_run:\n    workflows: ["Deploy static content to pages"]\n    types: [completed]\n\njobs:\n  validate:\n    if: github.event_name != 'workflow_run'\n    runs-on: ubuntu-26.04\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 1\n      - name: Validate registries\n        run: |\n          python3 - <<'PY'\n          import json\n          from pathlib import Path\n          for f in [Path('pages/lessons/games.json'), Path('apps/apps.json')]:\n              data=json.loads(f.read_text())\n              assert isinstance(data,list), f'{f} must contain an array'\n              names=[str(x.get('name','')).strip().lower() for x in data]\n              assert all(names), f'{f} contains an item without a name'\n              assert len(names)==len(set(names)), f'{f} contains duplicate names'\n          print('Cosmic registries are valid.')\n          PY\n      - name: Check core files\n        run: |\n          test -f index.html\n          test -f cosmic-hub.html\n          test -f cosmic-hub.css\n          test -f pages/lessons/lessons.html\n          test -f pages/lessons/game-shell.html\n          echo "Core Cosmic files are present."\n\n  validate-games:\n    if: github.event_name != 'workflow_run'\n    name: Fast original-game validation\n    runs-on: ubuntu-26.04\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 1\n      - name: Validate all original games\n        run: python3 scripts/validate-games.py\n\n  iframe-smoke:\n    if: >-\n      (github.event_name == 'workflow_run' &&\n       github.event.workflow_run.conclusion == 'success') ||\n      github.event_name == 'workflow_dispatch'\n    name: Game iframe smoke test\n    runs-on: ubuntu-26.04\n    timeout-minutes: 4\n    steps:\n      - name: Checkout the exact deployed commit\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 1\n          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\n      - name: Install browser test dependencies\n        run: |\n          npm init -y >/dev/null 2>&1\n          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1\n      - name: Test every game iframe\n        env:\n          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}\n          COSMIC_DEPLOYMENT_WAIT: "30000"\n          COSMIC_GAME_HTTP_TIMEOUT: "6000"\n          COSMIC_TARGET_CONCURRENCY: "48"\n          COSMIC_BROWSER_CONCURRENCY: "8"\n          COSMIC_GAME_NAV_TIMEOUT: "5000"\n          COSMIC_GAME_FRAME_WAIT: "5000"\n          COSMIC_GAME_LOAD_WAIT: "500"\n          COSMIC_BROWSER_SAMPLE: "12"\n        run: |\n          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"\n          test -n "$CHROME"\n          CHROME_PATH="$CHROME" node scripts/validate-game-iframes.mjs\n