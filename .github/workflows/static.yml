name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py
      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true
      - name: Prepare identical deployment files
        env:
          PASSWORD_FOR_GAMES_UNLOCK: ${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='.gitignore' ./ _site/
          cp wrangler.jsonc _site/wrangler.jsonc
          BUILD_TAG="${GITHUB_SHA:0:12}" python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          site=Path('_site')
          build_tag=os.environ['BUILD_TAG']
          lessons=site/'pages/lessons/lessons.html'
          if not lessons.exists(): raise SystemExit('Missing Pages lessons directory')
          password=os.environ.get('PASSWORD_FOR_GAMES_UNLOCK')
          if not password: raise SystemExit('PASSWORD_FOR_GAMES_UNLOCK is not configured')
          lessons_text=lessons.read_text(encoding='utf-8')
          if 'PASSWORD_PLACEHOLDER' not in lessons_text: raise SystemExit('Game password placeholder is missing')
          lessons.write_text(lessons_text.replace('PASSWORD_PLACEHOLDER',password),encoding='utf-8')
          required_assets=['.assetsignore','collections.json','cosmic-hub.css','cosmic-hub.html','cosmic-sw.js','index.html','manifest.json','offline.html','scripts/cosmic-hub.js','scripts/cosmic-hub-preflight.js','scripts/cosmic-hub-repair.js','sw.js']
          absent=[path for path in required_assets if not (site/path).is_file()]
          if absent: raise SystemExit('Cloudflare staging is missing hub assets: '+', '.join(absent))

          local_assets={'cosmic-hub.js':build_tag,'cosmic-hub-preflight.js':build_tag,'cosmic-hub-repair.js':build_tag,'cosmic-admin-guard.js':build_tag,'cosmic-launch-fix.js':build_tag,'cosmic-feedback.js':build_tag,'cosmic-profile-widget.js':build_tag,'cosmic-pwa.js':build_tag,'settings-engine.js':build_tag}
          script_pat=re.compile(r'(?P<prefix>(?:\.\./)+scripts/(?P<name>[^"\']+?\.js))(?:\?[^"\']*)?(?P<suffix>["\'])',re.I)
          settings_pat=re.compile(r'(?P<prefix>(?:\.\./)+settings/(?P<name>settings-engine\.js))(?:\?[^"\']*)?(?P<suffix>["\'])',re.I)
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.htm'}: continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              original=value
              def replace_script(m):
                  name=m.group('name')
                  return f"{m.group('prefix')}?build={build_tag}{m.group('suffix')}" if name in local_assets else m.group(0)
              value=script_pat.sub(replace_script,value)
              value=settings_pat.sub(lambda m:f"{m.group('prefix')}?build={build_tag}{m.group('suffix')}",value)
              if value!=original: p.write_text(value,encoding='utf-8')

          # Load the developer toolkit globally on every HTML page. The loader
          # computes the correct /cosmic/ base on GitHub Pages and / on Cloudflare.
          dev_loader_name='scripts/cosmic-dev-loader.js'
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.htm'}: continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if dev_loader_name in value: continue
              depth=len(p.relative_to(site).parent.parts)
              prefix='../'*depth
              tag=f'<script src="{prefix}{dev_loader_name}?build={build_tag}"></script>'
              if re.search(r'</body>',value,re.I):
                  value=re.sub(r'</body>',tag+'\\n</body>',value,count=1,flags=re.I)
              else:
                  value += '\\n'+tag+'\\n'
              p.write_text(value,encoding='utf-8')

          text=lessons.read_text(encoding='utf-8')
          preflight_tag=f'<script src="../../scripts/cosmic-hub-preflight.js?build={build_tag}"></script>'
          hub_tag=f'<script src="../../scripts/cosmic-hub.js?build={build_tag}"></script>'
          repair_tag=f'<script src="../../scripts/cosmic-hub-repair.js?build={build_tag}"></script>'
          hub_pattern=re.compile(r'<script\s+src=["\'](?:\.\./)+scripts/cosmic-hub\.js(?:\?[^"\']*)?["\']></script>',re.I)
          if not hub_pattern.search(text):
              raise SystemExit('Cannot install Cosmic Hub loader: missing existing cosmic-hub.js script')
          text=hub_pattern.sub(hub_tag,text,count=1)
          if preflight_tag not in text:
              text=text.replace(hub_tag,preflight_tag+'\n'+hub_tag,1)
          if repair_tag not in text:
              if '</body>' not in text: raise SystemExit('Cannot install Cosmic Hub repair loader: missing </body>')
              text=text.replace('</body>',repair_tag+'\n</body>',1)
          required=[preflight_tag,hub_tag,repair_tag]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Generated lessons.html is missing: '+', '.join(missing))

          lessons.write_text(text,encoding='utf-8')
          required=[preflight_tag,hub_tag,repair_tag]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Generated lessons.html is missing: '+', '.join(missing))

          worker=site/'worker.js'
          if not worker.is_file(): raise SystemExit('Missing worker.js')
          worker_text=worker.read_text(encoding='utf-8')
          worker_marker="const COSMIC_DEPLOYMENT_COMMIT = '__COSMIC_DEPLOYMENT_COMMIT__';"
          if worker_marker not in worker_text: raise SystemExit('Worker deployment marker is missing')
          timestamp_marker="const COSMIC_DEPLOYMENT_TIMESTAMP = '__COSMIC_DEPLOYMENT_TIMESTAMP__';"
          worker_text=worker_text.replace(worker_marker, "const COSMIC_DEPLOYMENT_COMMIT = '${{ github.sha }}';")
          worker_text=worker_text.replace(timestamp_marker, "const COSMIC_DEPLOYMENT_TIMESTAMP = '${{ github.event.head_commit.timestamp }}';")
          worker.write_text(worker_text, encoding='utf-8')

          hub=site/'scripts/cosmic-hub.js'
          hub_text=hub.read_text(encoding='utf-8')
          sw_path=site/'sw.js'
          sw=sw_path.read_text(encoding='utf-8').replace('cosmic-shell-v9','cosmic-shell-v10')
          sw_path.write_text(sw,encoding='utf-8')

          registration='navigator.serviceWorker.register'
          owners=[]
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.html','.htm'} or p == hub: continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if registration in value: p.write_text(value.replace(registration,'Promise.resolve'),encoding='utf-8')
          for p in site.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.js','.html','.htm'}:
                  try: count=p.read_text(encoding='utf-8').count(registration)
                  except UnicodeDecodeError: continue
                  if count: owners.append(f'{p.relative_to(site)}:{count}')
          if owners != ['scripts/cosmic-hub.js:1']: raise SystemExit(f'Expected only scripts/cosmic-hub.js to register the service worker; found {owners}')

          sw=(site/'sw.js').read_text(encoding='utf-8')
          if "cosmic-shell-v10" not in sw or "cache: 'no-store'" not in sw: raise SystemExit('Authoritative sw.js validation failed')
          cache_names=set(re.findall(r"['\"](cosmic-shell-v\d+)['\"]",sw))
          obsolete={f'cosmic-shell-v{i}' for i in (1,3,4,5,6,7,8,9)}
          if cache_names & obsolete: raise SystemExit('Obsolete cache name remains in sw.js: '+', '.join(sorted(cache_names & obsolete)))
          if cache_names != {'cosmic-shell-v10'}: raise SystemExit(f'Unexpected service-worker cache names: {sorted(cache_names)}')
          if "const COSMIC_HUB_RELEASE = 'cosmic-hub-v9'" not in hub_text: raise SystemExit('Current Cosmic Hub release marker is missing')
          marker={'source_commit':'${{ github.sha }}','build_tag':build_tag,'profile_widget':f'scripts/cosmic-profile-widget.js?build={build_tag}','hub_release':'cosmic-hub-v9','service_worker_cache':'cosmic-shell-v10'}
          (site/'deployment.json').write_text(json.dumps(marker,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(marker))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload exact build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Verify Cloudflare credentials
        working-directory: '_site'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 whoami
      - name: Deploy exact same build to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '_site'
          command: deploy --config wrangler.jsonc
      - name: Verify Cloudflare deployment serves this build
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deployments list --name cosmicv2
          python3 - <<'PY'
          import json, os, urllib.request
          expected=os.environ['EXPECTED_COMMIT']
          url='https://cosmicv2.v75ultimate.workers.dev/api/deployment-status?verify='+expected
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Cosmic-Deployment-Verification/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          if data.get('source_commit') != expected:
              raise SystemExit(f'Cloudflare Worker build mismatch. Expected {expected}, got {data}')
          print(f'VERIFIED Cloudflare Worker build: {data}')
          PY

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify GitHub Pages contains this exact build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url=os.environ['PAGES_URL'].rstrip('/')+'/deployment.json?verify='+os.environ['EXPECTED_COMMIT']
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
          if data.get('source_commit')!=os.environ['EXPECTED_COMMIT']:
              raise SystemExit(f"GitHub Pages build mismatch. Expected {os.environ['EXPECTED_COMMIT']}, got {data}")
          print(f'VERIFIED GitHub Pages: {data}')
          PY