<!DOCTYPE html>
<html>
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { --card-bg: rgba(6, 20, 16, 0.76); --card-border: rgba(110, 255, 201, 0.42); --card-hover: rgba(127, 255, 212, 0.16); }
        #gamesgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 0; align-items: stretch; }
        .game-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
        .game-card:hover { background: linear-gradient(180deg, var(--card-bg), var(--card-hover)); }
        .game-thumb, .game-thumb-placeholder { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; }
        .game-thumb { object-fit: cover; }
        .game-thumb-placeholder { display: grid; place-items: center; padding: 12px; box-sizing: border-box; background: rgba(0, 0, 0, 0.3); color: #5EFD28; text-align: center; }
        .game-title { font-size: 0.85rem; line-height: 1.2; text-align: center; min-height: 2.2em; display: grid; place-items: center; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .play-btn, .blank-btn { width: 100%; height: 36px; font-size: 0.72rem; border-radius: 999px; padding: 0; }
        #gamesearchform { display: flex; justify-content: center; margin-bottom: 18px; }
        #gamesearchinput { background: rgba(0,0,0,0.4); color: #5EFD28; font-family: inherit; padding: 0 17px; height: 48px; outline: 2px solid #00FF00; border: none; border-radius: 50px; width: min(420px, 90vw); }
        input::placeholder { color: #5EFD28; }
        #no-results { grid-column: 1 / -1; text-align: center; }
    </style>
</head>
<body>
    <form id="gamesearchform" class="flex-center" onsubmit="return false;">
        <input id="gamesearchinput" autocomplete="off" type="text" placeholder="Search games" />
    </form>
    <div id="gamesgrid">
        <p id="loading">Loading games...</p>
        <p id="no-results">No results...</p>
    </div>
    <script>
        const searchInput = document.getElementById('gamesearchinput');
        const grid = document.getElementById('gamesgrid');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('no-results');
        let cards = [];

        noResults.style.display = 'none';
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }
        function openGame(url) { window.location.href = normalizeUrl(url); }
        function openGameBlank(url) {
            const target = normalizeUrl(url);
            const win = window.open('about:blank', '_blank');
            if (!win) return;
            win.document.open();
            win.document.write('<!DOCTYPE html><html><head><style>*{margin:0;padding:0;overflow:hidden;}html,body{width:100%;height:100%;background:black;}iframe{border:0;width:100%;height:100%;display:block;}</style></head><body><iframe allowfullscreen src="' + target + '"></iframe></body></html>');
            win.document.close();
            localStorage.setItem('lastPlayedGame', target);
        }
        function createCard(game) {
            const card = document.createElement('article');
            card.className = 'game-card';
            card.dataset.name = game.name.toLowerCase();
            if (game.image) {
                const thumb = document.createElement('img');
                thumb.src = gameUrl({path: game.image});
                thumb.alt = '';
                thumb.draggable = false;
                thumb.className = 'game-thumb';
                card.appendChild(thumb);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'game-thumb-placeholder';
                placeholder.textContent = game.name;
                card.appendChild(placeholder);
            }
            const name = document.createElement('div');
            name.className = 'game-title';
            name.textContent = game.name;
            const actions = document.createElement('div');
            actions.className = 'card-actions';
            const playBtn = document.createElement('button');
            playBtn.className = 'play-btn';
            playBtn.textContent = 'Play';
            playBtn.addEventListener('click', () => { localStorage.setItem('lastPlayedGame', gameUrl(game)); openGame(gameUrl(game)); });
            const blankBtn = document.createElement('button');
            blankBtn.className = 'blank-btn';
            blankBtn.textContent = 'About Blank';
            blankBtn.addEventListener('click', () => openGameBlank(gameUrl(game)));
            actions.append(playBtn, blankBtn);
            card.append(name, actions);
            return card;
        }
        function filterGames() {
            const query = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;
            cards.forEach(card => {
                const matches = !query || card.dataset.name.includes(query);
                card.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }
        searchInput.addEventListener('input', filterGames);
        fetch('games.json')
            .then(response => { if (!response.ok) throw new Error('Registry request failed'); return response.json(); })
            .then(games => {
                loading.remove();
                games.forEach(game => grid.insertBefore(createCard(game), noResults));
                cards = Array.from(grid.querySelectorAll('.game-card'));
                filterGames();
            })
            .catch(() => { loading.textContent = 'Games could not be loaded.'; });
    </script>
</body>
</html>
