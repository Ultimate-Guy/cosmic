name: Deploy Cosmic Worker

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare API token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          token="$RAW_CLOUDFLARE_API_TOKEN"
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#\"}"
          token="${token%\"}"
          test -n "$token"
          code="$(curl -sS -o /tmp/cloudflare-token-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "Cloudflare API token verification HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "Cloudflare API token is invalid or not accepted. Replace CLOUDFLARE_API_TOKEN in GitHub Secrets with the actual Cloudflare API Token value."
            exit 1
          fi
          grep -q '"success":true' /tmp/cloudflare-token-check.json
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Deploy Worker and upload runtime secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            COSMIC_ADMIN_PASSWORD
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          COSMIC_ADMIN_PASSWORD: ${{ secrets.COSMIC_ADMIN_PASSWORD }}
