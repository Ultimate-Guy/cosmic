name: Cosmic validation
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate registries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for f in [Path('pages/lessons/games.json'), Path('apps/apps.json')]:
              data=json.loads(f.read_text())
              assert isinstance(data,list), f'{f} must contain an array'
              names=[str(x.get('name','')).strip().lower() for x in data]
              assert all(names), f'{f} contains an item without a name'
              assert len(names)==len(set(names)), f'{f} contains duplicate names'
          print('Cosmic registries are valid.')
          PY
      - name: Check core files
        run: |
          test -f index.html
          test -f cosmic-hub.html
          test -f cosmic-hub.css
          test -f pages/lessons/lessons.html
          test -f pages/lessons/game-shell.html
          echo "Core Cosmic files are present."

  browser-smoke:
    name: Browser game smoke test
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install browser driver
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
      - name: Test deployed game shell
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const { execFileSync } = require('child_process');
          const chrome = execFileSync('bash',['-lc','command -v google-chrome || command -v chromium || command -v chromium-browser']).toString().trim();
          const target = 'https://ultimate-guy.github.io/cosmic/pages/lessons/game-shell.html?game=' +
            encodeURIComponent('https://cosmicv2.v75ultimate.workers.dev/pages/lessons/Snow%20Rider%203D/');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});
            const page=await browser.newPage({viewport:{width:1365,height:768}});
            const consoleErrors=[], pageErrors=[], failed=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
            const resp=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(15000);
            const frameUrls = await page.locator('iframe').evaluateAll(fs => fs.map(f => f.src));
            const direct = await page.request.get('https://cosmicv2.v75ultimate.workers.dev/pages/lessons/Snow%20Rider%203D/');
            const directText = await direct.text();
            const cdn = await page.request.get('https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/UnityLoader.js');
            const state=await page.evaluate(()=>({
              href:location.href,
              frameSrc:document.querySelector('#game')?.src||null,
              frameCount:document.querySelectorAll('iframe').length,
              frameLoaded:document.querySelector('#game')?.complete ?? null,
              frameUrls
            }));
            console.log(JSON.stringify({status:resp?.status(),target,state,consoleErrors,pageErrors,failed},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
