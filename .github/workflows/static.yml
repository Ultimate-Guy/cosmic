name: Deploy static content to Pages

on:
  # Triggers on every push to master, including UI changes and new game folders
  push:
    branches: ["master"]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Allows the bot to "type" changes into games.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to make syncing easier

      # 1. Sync BEFORE running the Python script to avoid Exit Code 128
      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. Run your registry script
      - name: Generate game registry
        run: python3 scripts/generate-game-registry.py

      # 3. Save games.json changes back to your repo automatically
      - name: Commit games.json changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of games.json [skip ci]"
          file_pattern: 'pages/lessons/games.json'
          skip_dirty_check: false 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
