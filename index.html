<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cosmic</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #070f15; /* Kept original color */
      color: #8fecff;      /* Kept original color */
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Updated container to take up the full screen */
    .full-screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: #0d1a21; /* Kept original card background */
      text-align: center;
    }

    /* Big font for the top welcome message */
    h1 {
      margin: 0 0 20px;
      font-size: 5rem; /* Massive font size */
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #3accff; /* Brighter accent from your card border */
    }

    p {
      margin: 0 0 40px;
      font-size: 1.5rem;
      opacity: .9;
    }

    .btn-group {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1000px;
    }

    /* Buttons are now way bigger */
    button {
      flex: 1;
      min-width: 300px;
      height: 120px; /* Way bigger height */
      padding: 0 40px;
      border: 2px solid #3accff66;
      border-radius: 20px;
      background: #2dccff; /* Kept original color */
      color: #031721;      /* Kept original color */
      font-size: 2rem;    /* Bigger text inside buttons */
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #60dcff;
      transform: scale(1.05);
      box-shadow: 0 0 30px #2dccff66;
    }

    /* Bigger "continue without cloak" link */
    .link {
      display: block;
      margin-top: 50px;
      font-size: 2rem; /* Much bigger link text */
      color: #8fecff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="full-screen-container">
    <h1>Welcome to Cosmic</h1>
    <p>Launch site in cloak mode</p>
    
    <div class="btn-group">
      <button id="launchBlank">About:Blank Cloak</button>
      <button id="launchBlob">Blob Cloak</button>
    </div>

    <a class="link" href="pages/lessons/lessons.html">Open without cloak</a>
  </main>

  <script>
    const targetPath = 'pages/lessons/lessons.html';

    function getCloakHTML(targetUrl) {
      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe allowfullscreen src="${targetUrl}"></iframe>
</body>
</html>`;
    }

    document.getElementById('launchBlank').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const win = window.open('about:blank', '_blank');
      if (!win) return;
      win.document.open();
      win.document.write(getCloakHTML(target));
      win.document.close();
      window.location.replace('https://www.google.com');
    });

    document.getElementById('launchBlob').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const htmlContent = getCloakHTML(target);
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      const win = window.open(blobUrl, '_blank');
      if (!win) return;
      window.location.replace('https://www.google.com');
    });
  </script>
</body>
</html>
