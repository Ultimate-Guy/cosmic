<!DOCTYPE html>
<html>
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        /* Keeping your original card and grid styles exactly as they were */
        :root { 
            --card-bg: rgba(6, 20, 16, 0.76); 
            --card-border: rgba(110, 255, 201, 0.42); 
            --card-hover: rgba(127, 255, 212, 0.16); 
            --accent: #2dccff;
        }

        body { margin: 0; min-height: 100vh; background: #070f15; color: #8fecff; font-family: Arial, sans-serif; }

        /* --- New Top Bar: Centered Title & Logo --- */
        #top-bar {
            display: flex;
            align-items: center;
            justify-content: center; /* Centers Cosmic and Logo */
            padding: 15px 40px;
            background: rgba(13, 26, 33, 0.95);
            border-bottom: 1px solid var(--card-border);
            position: relative;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand h1 { 
            margin: 0; font-size: 2.8rem; letter-spacing: 6px; 
            color: var(--accent); text-transform: uppercase; 
        }

        /* --- Settings Trigger (Top Right) --- */
        .settings-trigger {
            position: absolute; right: 40px; background: transparent; 
            border: 1px solid var(--card-border); color: var(--accent);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }

        /* --- Original Grid and Search Styles --- */
        #gamesearchform { display: flex; justify-content: center; margin: 20px 0; }
        #gamesearchinput { 
            background: rgba(0,0,0,0.4); color: var(--accent); padding: 0 17px; 
            height: 48px; border: 1px solid var(--card-border); border-radius: 50px; width: min(420px, 90vw); 
        }

        #gamesgrid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 14px; padding: 0 40px 40px; 
        }

        .game-card { 
            display: flex; flex-direction: column; gap: 8px; padding: 10px; 
            border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border); 
        }
        .game-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 12px; object-fit: cover; }
        .game-title { font-size: 0.85rem; text-align: center; min-height: 2.2em; display: grid; place-items: center; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .play-btn, .blank-btn { width: 100%; height: 36px; font-size: 0.72rem; border-radius: 999px; cursor: pointer; font-weight: bold; }
        .play-btn { background: var(--accent); color: #031721; border: none; }
        .blank-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* --- Full Screen Game Loader --- */
        #page-loader { position: fixed; inset: 0; background: #000; display: none; z-index: 500; }
        #page-loader iframe { width: 100%; height: 100%; border: none; }

        /* --- Settings Modal --- */
        #settings-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; place-items: center; z-index: 2000;
        }
        .modal-content { background: #0d1a21; border: 1px solid var(--card-border); padding: 30px; border-radius: 20px; width: 380px; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--card-border); color: var(--accent); border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="brand">
            <img src="../../imgs/cosmic.png" width="45" height="45" alt="Logo" />
            <h1>Cosmic</h1>
        </div>
        <button class="settings-trigger" onclick="toggleSettings()">Settings</button>
    </header>

    <main id="main-content">
        <form id="gamesearchform" onsubmit="return false;">
            <input id="gamesearchinput" autocomplete="off" type="text" placeholder="Search games" />
        </form>
        <div id="gamesgrid">
            <p id="loading">Connecting to Registry...</p>
            <p id="no-results" style="display:none; grid-column: 1/-1; text-align: center;">No results...</p>
        </div>
    </main>

    <!-- Game Loader Section -->
    <section id="page-loader">
        <iframe id="game-iframe" allowfullscreen></iframe>
    </section>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="color:var(--accent); margin-top:0;">Cosmic Settings</h3>
            <label>Panic Key</label>
            <input type="text" id="panic-key" placeholder="e.g. \" maxlength="1" />
            <label>Panic URL</label>
            <input type="text" id="panic-url" placeholder="https://classroom.google.com" />
            <label>Tab Masking</label>
            <button class="play-btn" style="height:38px; width:100%; margin-bottom:5px" onclick="mask('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png')">Classroom</button>
            <button class="play-btn" style="height:38px; width:100%" onclick="mask('Google', 'https://www.google.com/favicon.ico')">Google</button>
            <button class="play-btn" style="width:100%; height:45px; margin-top:15px" onclick="toggleSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('gamesearchinput');
        const grid = document.getElementById('gamesgrid');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('no-results');
        let cards = [];

        // --- Original Pathing: Keeping this exactly the same as your request ---
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        // Modified launch logic: Hides the bar and grid to focus on the game
        function launch(url) {
            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('page-loader').style.display = 'block';
            document.getElementById('game-iframe').src = url;
        }

        function openBlank(url) {
            const win = window.open('about:blank', '_blank');
            if (!win) return;
            win.document.write('<!DOCTYPE html><html><body style="margin:0;background:#000;"><iframe src="'+url+'" style="border:none;width:100vw;height:100vh;" allowfullscreen></iframe></body></html>');
            win.document.close();
        }

        // --- Settings Functionality ---
        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
        }

        function mask(title, icon) {
            document.title = title;
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon'; link.rel = 'shortcut icon'; link.href = icon;
            document.getElementsByTagName('head').appendChild(link);
        }

        window.addEventListener('keydown', (e) => {
            const pk = document.getElementById('panic-key').value || '\\';
            const pu = document.getElementById('panic-url').value || 'https://classroom.google.com';
            if (e.key === pk) window.location.replace(pu);
        });

        // --- Keeping original createCard logic exactly the same ---
        function createCard(game) {
            const card = document.createElement('article');
            card.className = 'game-card';
            card.dataset.name = game.name.toLowerCase();
            const finalUrl = gameUrl(game);

            if (game.image) {
                const thumb = document.createElement('img');
                thumb.src = gameUrl({path: game.image});
                thumb.className = 'game-thumb';
                card.appendChild(thumb);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'game-thumb';
                placeholder.style.background = '#000';
                placeholder.style.display = 'grid';
                placeholder.style.placeItems = 'center';
                placeholder.textContent = game.name;
                card.appendChild(placeholder);
            }

            const name = document.createElement('div');
            name.className = 'game-title';
            name.textContent = game.name;

            const actions = document.createElement('div');
            actions.className = 'card-actions';

            const playBtn = document.createElement('button');
            playBtn.className = 'play-btn';
            playBtn.textContent = 'Play';
            playBtn.onclick = () => launch(finalUrl);

            const blankBtn = document.createElement('button');
            blankBtn.className = 'blank-btn';
            blankBtn.textContent = 'Blank';
            blankBtn.onclick = () => openBlank(finalUrl);

            actions.append(playBtn, blankBtn);
            card.append(name, actions);
            return card;
        }

        function filterGames() {
            const query = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;
            cards.forEach(card => {
                const matches = !query || card.dataset.name.includes(query);
                card.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });
            noResults.style.display = visibleCount === 0 ? 'block' : 'none';
        }

        searchInput.addEventListener('input', filterGames);

        // Fetching the local registry
        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                loading.remove();
                games.forEach(game => grid.insertBefore(createCard(game), noResults));
                cards = Array.from(grid.querySelectorAll('.game-card'));
            });
    </script>
</body>
</html>
