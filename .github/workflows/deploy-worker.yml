name: Deploy Cosmic Worker

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Cloudflare API token
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          token="$RAW_CLOUDFLARE_API_TOKEN"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#\"}"
          token="${token%\"}"
          test -n "$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Deploy Worker and upload runtime secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            COSMIC_ADMIN_PASSWORD
        env:
          COSMIC_ADMIN_PASSWORD: ${{ secrets.COSMIC_ADMIN_PASSWORD }}
