name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject Game Password
        run: sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html
      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py
      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true
      - name: Prepare identical deployment files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='.gitignore' ./ _site/
          cp wrangler.jsonc _site/wrangler.jsonc
          BUILD_TAG="${GITHUB_SHA:0:12}" python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          site=Path('_site')
          build_tag=os.environ['BUILD_TAG']
          lessons=site/'pages/lessons/lessons.html'
          if not lessons.exists(): raise SystemExit('Missing Pages lessons directory')

          # Every deployment gets unique local asset URLs so browsers cannot keep an old
          # Cosmic Hub/settings script from a previous Cloudflare build.
          local_assets={
              'cosmic-hub.js': build_tag,
              'cosmic-admin-guard.js': build_tag,
              'cosmic-launch-fix.js': build_tag,
              'cosmic-feedback.js': build_tag,
              'cosmic-profile-widget.js': build_tag,
              'cosmic-pwa.js': build_tag,
              'settings-engine.js': build_tag,
          }
          script_pat=re.compile(r'(?P<prefix>(?:\.\./)+scripts/(?P<name>[^"\']+?\.js))(?:\?[^"\']*)?(?P<suffix>["\'])',re.I)
          settings_pat=re.compile(r'(?P<prefix>(?:\.\./)+settings/(?P<name>settings-engine\.js))(?:\?[^"\']*)?(?P<suffix>["\'])',re.I)
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.htm'}: continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              original=value
              def replace_script(m):
                  name=m.group('name')
                  return f"{m.group('prefix')}?build={build_tag}{m.group('suffix')}" if name in local_assets else m.group(0)
              value=script_pat.sub(replace_script,value)
              def replace_settings(m):
                  return f"{m.group('prefix')}?build={build_tag}{m.group('suffix')}"
              value=settings_pat.sub(replace_settings,value)
              if value!=original: p.write_text(value,encoding='utf-8')

          text=lessons.read_text(encoding='utf-8')
          required=[f'cosmic-hub.js?build={build_tag}',f'cosmic-admin-guard.js?build={build_tag}',f'cosmic-launch-fix.js?build={build_tag}',f'cosmic-feedback.js?build={build_tag}',f'cosmic-profile-widget.js?build={build_tag}']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Generated lessons.html is missing: '+', '.join(missing))

          hub=site/'scripts/cosmic-hub.js'
          registration='navigator.serviceWorker.register'
          owners=[]
          for p in site.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js','.html','.htm'} or p == hub: continue
              try: value=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if registration in value: p.write_text(value.replace(registration,'Promise.resolve'),encoding='utf-8')
          for p in site.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.js','.html','.htm'}:
                  try: count=p.read_text(encoding='utf-8').count(registration)
                  except UnicodeDecodeError: continue
                  if count: owners.append(f'{p.relative_to(site)}:{count}')
          if owners != ['scripts/cosmic-hub.js:1']: raise SystemExit(f'Expected only scripts/cosmic-hub.js to register the service worker; found {owners}')

          sw=(site/'sw.js').read_text(encoding='utf-8')
          if "cosmic-shell-v7" not in sw or "cache: 'no-store'" not in sw: raise SystemExit('Authoritative sw.js validation failed')
          if any(x in sw for x in ('cosmic-shell-v1','cosmic-shell-v3','cosmic-shell-v4','cosmic-shell-v5','cosmic-shell-v6')): raise SystemExit('Obsolete cache name remains in sw.js')
          marker={'source_commit':'${{ github.sha }}','build_tag':build_tag,'profile_widget':f'scripts/cosmic-profile-widget.js?build={build_tag}','service_worker_cache':'cosmic-shell-v7'}
          (site/'deployment.json').write_text(json.dumps(marker,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(marker))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload exact build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy exact same build to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '_site'
          command: deploy --config wrangler.jsonc

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify GitHub Pages contains this exact build
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url=os.environ['PAGES_URL'].rstrip('/')+'/deployment.json?verify='+os.environ['EXPECTED_COMMIT']
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
          if data.get('source_commit')!=os.environ['EXPECTED_COMMIT']:
              raise SystemExit(f"GitHub Pages build mismatch. Expected {os.environ['EXPECTED_COMMIT']}, got {data}")
          print(f'VERIFIED GitHub Pages: {data}')
          PY
