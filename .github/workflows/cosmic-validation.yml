name: Cosmic validation

on:
  workflow_run:
    workflows: ["Deploy static content to pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Validate Cosmic and deployed game iframes
    runs-on: ubuntu-26.04
    timeout-minutes: 26
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Sync UGS catalog from cosmicgames UGS-Files only
        run: python3 scripts/sync-ugs-catalog.py

      - name: Generate registries and clean generated game pages
        run: python3 scripts/generate-game-registry.py

      - name: Validate registries
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def duplicate_key(name):
              value = str(name or "").strip().casefold()
              previous = None
              while value != previous:
                  previous = value
                  value = re.sub(r"\(ugs(?:\s+\d+)?\)$", "", value).strip()
                  value = re.sub(r"\(\d+\)$", "", value).strip()
              return "".join(ch for ch in value if ch.isalnum())

          for path in (Path("pages/lessons/games.json"), Path("apps/apps.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(data, list), f"{path} must contain an array"

              names = [str(item.get("name", "")).strip() for item in data]
              assert all(names), f"{path} contains an item without a name"

              keys = [duplicate_key(name) for name in names]
              assert len(keys) == len(set(keys)), (
                  f"{path} contains duplicate game names after Cosmic normalization"
              )

              paths = [str(item.get("path", "")).strip() for item in data]
              assert all(paths), f"{path} contains an item without a path"
              assert len(paths) == len(set(paths)), f"{path} contains duplicate paths"

          print("Cosmic registries are valid.")
          PY

      - name: Check core files
        run: |
          test -f index.html
          test -f cosmic-hub.html
          test -f cosmic-hub.css
          test -f pages/lessons/lessons.html
          test -f pages/lessons/game-shell.html
          test ! -e pages/lessons/cosmicgames.json
          echo "Core Cosmic files are present."

      - name: Validate all original games
        run: python3 scripts/validate-games.py

      - name: Install browser test dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1

      - name: Verify live deployment and test every game target
        env:
          GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          COSMIC_DEPLOYMENT_WAIT: "30000"
          COSMIC_GAME_HTTP_TIMEOUT: "3500"
          COSMIC_TARGET_CONCURRENCY: "64"
          COSMIC_BROWSER_CONCURRENCY: "4"
          COSMIC_GAME_NAV_TIMEOUT: "3500"
          COSMIC_GAME_FRAME_WAIT: "1800"
          COSMIC_GAME_LOAD_WAIT: "250"
          COSMIC_BROWSER_SAMPLE: "8"
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node scripts/validate-game-iframes.mjs
