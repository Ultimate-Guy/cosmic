<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cosmic Game</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#home{position:fixed;top:12px;left:12px;z-index:2147483647;display:block!important;visibility:visible!important;opacity:1!important;padding:9px 15px;border:2px solid #2dccff;border-radius:10px;background:#0d1a21;color:#2dccff;font:700 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.55)}
#home:hover{background:#16303b}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<button id="home" type="button">← Home</button>
<iframe id="game" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
(function(){
  const marker='/pages/lessons/';
  const path=location.pathname||'';
  const index=path.indexOf(marker);
  const prefix=index>=0?path.slice(0,index):(location.hostname.endsWith('.github.io')?'/cosmic':'');
  const home=location.origin+prefix+marker+'lessons.html';
  document.getElementById('home').addEventListener('click',function(){
    try{sessionStorage.setItem('cosmicReturnFromGame','1');}catch(e){}
    location.assign(home);
  });

  const params=new URLSearchParams(location.search);
  const game=params.get('game');
  if(!game){location.replace(home);return;}

  try{
    // Always load the game from the same host as the shell. GitHub Pages gets
    // a Pages-only compatibility rewrite during deployment, while Cloudflare
    // continues serving the original files unchanged.
    document.getElementById('game').src=new URL(game,location.href).href;
  }catch(e){location.replace(home);}
})();
</script>
</body>
</html>
