<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic App</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131a}#appframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07131a}.home{position:fixed;top:12px;left:12px;z-index:2147483647;padding:8px 14px;border:2px solid #2dccff;border-radius:10px;background:#0d1a21;color:#2dccff;font:700 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.55)}.home:hover{background:#16303b}.error{position:fixed;inset:0;display:grid;place-items:center;color:#8da2ad;font:14px system-ui,sans-serif;text-align:center;padding:30px}.error b{color:#2dccff}</style></head><body><button class="home" onclick="location.href='apps.html'" aria-label="Return to Cosmic apps">← Home</button><iframe id="appframe" allow="fullscreen; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><script>const frame=document.getElementById('appframe');const params=new URLSearchParams(location.search);const url=params.get('url');if(!url){document.body.insertAdjacentHTML('beforeend','<div class="error"><div><b>Cosmic Apps</b><br>Missing app URL.</div></div>')}else{try{const target=new URL(url,location.href);if(!/^https?:$/.test(target.protocol))throw new Error('Invalid protocol');frame.src=target.href;document.title=params.get('name')||'Cosmic App'}catch(e){document.body.insertAdjacentHTML('beforeend','<div class="error"><div><b>Cosmic Apps</b><br>Invalid app URL.</div></div>')}}</script></body></html>
