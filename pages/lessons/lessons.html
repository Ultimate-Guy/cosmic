<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { 
            --accent: #2dccff;
            --card-border: rgba(45, 204, 255, 0.42); /* Blue outlines from screenshot [1] */
            --bg: #070f15;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #8fecff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling until unlocked */
        }

        /* --- Password Gate (Hidden after login) --- */
        #password-gate {
            position: fixed; inset: 0; background: var(--bg);
            display: grid; place-items: center; z-index: 9999;
        }
        .password-card {
            background: rgba(6, 20, 16, 0.8);
            border: 2px solid var(--card-border);
            border-radius: 20px; padding: 35px; width: 380px; text-align: center;
        }
        .pass-input-container { margin: 25px 0; display: flex; gap: 10px; }
        .pass-input-container input {
            flex-grow: 1; background: #000; border: 1px solid var(--card-border);
            color: var(--accent); padding: 12px; border-radius: 8px; outline: none;
        }
        .gate-btn {
            background: var(--accent); color: #000; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; padding: 0 15px;
        }
        .toggle-btn { background: rgba(45, 204, 255, 0.1); color: var(--accent); border: 1px solid var(--card-border); width: 45px; }

        /* --- Top Bar (Centered Branding) --- */
        #top-bar {
            display: flex; align-items: center; justify-content: center;
            padding: 15px 40px; background: rgba(13, 26, 33, 0.95);
            border-bottom: 1px solid var(--card-border); position: relative;
        }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand h1 { 
            margin: 0; font-size: 2.8rem; text-transform: uppercase; 
            letter-spacing: 5px; color: var(--accent); text-shadow: 0 0 10px var(--accent);
        }
        .settings-trigger {
            position: absolute; right: 40px; background: transparent; 
            border: 1px solid var(--card-border); color: var(--accent);
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
        }

        /* --- Hide Site Content until Unlocked --- */
        #site-content { display: none; }

        /* --- Original Styles (Untouched) --- */
        #gamesearchform { display: flex; justify-content: center; margin: 25px 0; }
        #gamesearchinput { 
            background: rgba(0,0,0,0.4); color: var(--accent); padding: 0 20px; 
            height: 50px; border: 1px solid var(--card-border); border-radius: 50px; width: min(420px, 90vw); 
        }
        #gamesgrid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 15px; padding: 0 40px 40px; 
        }
        /* Card outlines updated to blue to match screenshot [1] */
        .game-card { 
            border: 1px solid var(--card-border); border-radius: 16px; 
            padding: 10px; background: rgba(6, 20, 16, 0.76);
        }
    </style>
</head>
<body>

    <!-- Password Gate -->
    <div id="password-gate">
        <div class="password-card">
            <h2 style="color:var(--accent); letter-spacing:2px;">COSMIC ACCESS</h2>
            <div class="pass-input-container">
                <input type="password" id="pass-field" placeholder="Enter Password..." />
                <button class="toggle-btn" onclick="togglePass()"><i id="eye-icon" class="fas fa-eye"></i></button>
                <button class="gate-btn" onclick="checkPass()">Enter</button>
            </div>
            <p id="error-msg" style="color: #ff4d4d; font-size: 0.8rem; display: none;">Access Denied.</p>
        </div>
    </div>

    <!-- Main Site Content -->
    <div id="site-content">
        <header id="top-bar">
            <div class="brand">
                <img src="../../imgs/cosmic.png" width="45" height="45" alt="Logo" />
                <h1>Cosmic</h1>
            </div>
            <button class="settings-trigger">Settings</button>
        </header>

        <main>
            <form id="gamesearchform" onsubmit="return false;">
                <input id="gamesearchinput" type="text" placeholder="Search Cosmic games..." />
            </form>
            <div id="gamesgrid">
                <p id="loading">Connecting...</p>
            </div>
        </main>
    </div>

    <script>
        // --- Password Logic ---
        function togglePass() {
            const f = document.getElementById('pass-field');
            const i = document.getElementById('eye-icon');
            f.type = (f.type === "password") ? "text" : "password";
            i.className = (f.type === "password") ? "fas fa-eye" : "fas fa-eye-slash";
        }

        function checkPass() {
            // Placeholder for secret injection
            if (document.getElementById('pass-field').value === "PASSWORD_PLACEHOLDER") {
                document.getElementById('password-gate').style.display = 'none';
                document.getElementById('site-content').style.display = 'block';
                document.body.style.overflow = 'auto';
                loadGames(); // Start original loading logic
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // --- Original Loading Logic (RE-LOCKED) ---
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        function loadGames() {
            fetch('games.json')
                .then(res => res.json())
                .then(games => {
                    const grid = document.getElementById('gamesgrid');
                    document.getElementById('loading').remove();
                    games.forEach(game => {
                        const card = document.createElement('article');
                        card.className = 'game-card';
                        // Add your original card innerHTML here exactly as it was
                        card.innerHTML = `<div class="game-title">${game.name}</div><button class="gate-btn" style="width:100%; height:36px; margin-top:10px;" onclick="window.location.href='${gameUrl(game)}'">Play</button>`;
                        grid.appendChild(card);
                    });
                });
        }
    </script>
</body>
</html>
