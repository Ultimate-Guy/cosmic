name: Sync OpenRouter AI secret

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/sync-openrouter-secret.yml"
      - "worker.js"
      - "wrangler.jsonc"
  workflow_dispatch:

jobs:
  sync-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync OPENROUTER_API_KEY to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: secret put OPENROUTER_API_KEY --name cosmicv2
          preCommands: |
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "GitHub secret OPENROUTER_API_KEY is not configured."
              exit 1
            fi
