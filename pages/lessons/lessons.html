<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { --card-bg: rgba(6, 20, 16, 0.76); --accent: #2dccff; --card-border: rgba(45, 204, 255, 0.42); --card-hover: rgba(127, 255, 212, 0.16); }
        #gamesgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; margin-bottom: 0; align-items: stretch; }
        .game-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--card-border); backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
        .game-thumb { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover; }
        .game-title { font-size: 0.85rem; line-height: 1.2; text-align: center; min-height: 2.2em; display: grid; place-items: center; }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .play-btn, .blank-btn { width: 100%; height: 36px; font-size: 0.72rem; border-radius: 999px; cursor: pointer; font-weight: bold; }
        .play-btn { background: var(--accent); color: #031721; border: none; }
        .blank-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        #gamesearchform { display: flex; justify-content: center; margin: 25px 0; }
        #gamesearchinput { background: rgba(0,0,0,0.4); color: var(--accent); padding: 0 20px; height: 50px; border: 1px solid var(--card-border); border-radius: 50px; width: min(420px, 90vw); outline: none; }
        #password-gate { position: fixed; inset: 0; background: #070f15; display: grid; place-items: center; z-index: 9999; }
        .password-card { background: rgba(6, 20, 16, 0.8); border: 2px solid var(--card-border); border-radius: 20px; padding: 35px; width: 380px; text-align: center; }
        .pass-input-container { margin: 25px 0; display: flex; gap: 10px; }
        .pass-input-container input { flex-grow: 1; background: #000; border: 1px solid var(--card-border); color: var(--accent); padding: 12px; border-radius: 8px; outline: none; }
        #top-bar { display: flex; align-items: center; justify-content: center; padding: 15px 40px; background: rgba(13, 26, 33, 0.95); border-bottom: 1px solid var(--card-border); position: relative; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand h1 { margin: 0; font-size: 2.8rem; text-transform: uppercase; letter-spacing: 5px; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .nav-links { position: absolute; right: 40px; display: flex; gap: 10px; align-items: center; }
        .settings-trigger, .apps-trigger { background: transparent; border: 1px solid var(--card-border); color: var(--accent); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .settings-trigger:hover, .apps-trigger:hover { background: rgba(45, 204, 255, .12); }
        #updates-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(6px); z-index: 10000; }
        #updates-frame { display: block; width: min(680px, 94vw); height: min(560px, 84vh); border: 2px solid var(--card-border); border-radius: 20px; background: #061410; box-shadow: 0 20px 70px rgba(0,0,0,.6); }
        #close-updates { position: absolute; top: 18px; right: 22px; width: 42px; height: 42px; border: 1px solid var(--card-border); border-radius: 50%; background: rgba(13, 26, 33, .96); color: var(--accent); font-size: 25px; line-height: 1; cursor: pointer; z-index: 10001; }
        #close-updates:hover { background: rgba(45, 204, 255, .14); }
        @media (max-width: 600px) { #top-bar { padding: 12px 16px; } .brand h1 { font-size: 2rem; } .nav-links { right: 16px; gap: 6px; } .settings-trigger, .apps-trigger { padding: 7px 10px; font-size: 0.8rem; } #close-updates { top: 10px; right: 10px; } }
    </style>
</head>
<body>
    <div id="password-gate"><div class="password-card"><h2 style="color:var(--accent); letter-spacing:2px;">COSMIC ENTRY</h2><div class="pass-input-container"><input type="password" id="pass-field" placeholder="Enter Password..." /><button class="blank-btn" style="width: 45px;" onclick="togglePass()"><i id="eye-icon" class="fas fa-eye"></i></button><button class="play-btn" style="width: 80px;" onclick="checkPass()">Enter</button></div><p id="error-msg" style="color: #ff4d4d; font-size: 0.8rem; display: none;">Invalid Access Code.</p></div></div>
    <div id="site-content" style="display:none;"><header id="top-bar"><div class="brand"><img src="../../imgs/cosmic.png" width="45" height="45" alt="Logo" /><h1>Cosmic</h1></div><div class="nav-links"><button class="apps-trigger" onclick="window.location.href='../../apps/apps.html'">Apps</button><button class="settings-trigger" onclick="alert('Settings coming soon!')">Settings</button></div></header><main><form id="gamesearchform" onsubmit="return false;"><input id="gamesearchinput" autocomplete="off" type="text" placeholder="Search Cosmic games..." /></form><div id="gamesgrid"><p id="loading">Connecting to Registry...</p><p id="no-results" style="display:none; grid-column: 1/-1; text-align: center;">No results...</p></div></main></div>
    <div id="updates-overlay" role="dialog" aria-modal="true" aria-label="Cosmic Updates"><button id="close-updates" type="button" aria-label="Close updates">×</button><iframe id="updates-frame" title="Cosmic Updates"></iframe></div>
    <script>
        const unlockKey = 'cosmic-games-unlocked';
        const updatesSeenKey = 'cosmic-updates-seen';

        function showGames() { document.getElementById('password-gate').style.display = 'none'; document.getElementById('site-content').style.display = 'block'; document.body.style.overflow = 'auto'; }

        async function showUpdatesOnce() {
            if (sessionStorage.getItem(updatesSeenKey) === 'true') return;
            sessionStorage.setItem(updatesSeenKey, 'true');
            const overlay = document.getElementById('updates-overlay');
            const frame = document.getElementById('updates-frame');
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            try {
                const response = await fetch('./updates.html', { cache: 'no-cache' });
                if (!response.ok) throw new Error(`Updates returned ${response.status}`);
                frame.srcdoc = await response.text();
            } catch (error) {
                console.error('Could not load updates:', error);
                frame.srcdoc = '<!DOCTYPE html><html><body style="margin:0;background:#061410;color:#f0f4f8;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;"><div style="padding:30px;text-align:center;"><h1 style="color:#2dccff;">Updates</h1><p>Could not load the updates right now. Please try refreshing.</p></div></body></html>';
            }
        }

        function closeUpdates() { document.getElementById('updates-overlay').style.display = 'none'; document.body.style.overflow = 'auto'; }
        document.getElementById('close-updates').addEventListener('click', closeUpdates);

        function togglePass() { const f = document.getElementById('pass-field'); const i = document.getElementById('eye-icon'); f.type = (f.type === 'password') ? 'text' : 'password'; i.className = (f.type === 'password') ? 'fas fa-eye' : 'fas fa-eye-slash'; }
        function unlockAndShowUpdates() { sessionStorage.setItem(unlockKey, 'true'); showGames(); loadRegistry(); showUpdatesOnce(); }
        function checkPass() { if (document.getElementById('pass-field').value === 'PASSWORD_PLACEHOLDER') unlockAndShowUpdates(); else document.getElementById('error-msg').style.display = 'block'; }
        document.getElementById('pass-field').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPass(); });

        const searchInput = document.getElementById('gamesearchinput'); const grid = document.getElementById('gamesgrid'); const noResults = document.getElementById('no-results'); let cards = [];
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }
        function openBlank(url) { const win = window.open('about:blank', '_blank'); if (win) { win.document.write(`<!DOCTYPE html><html><body style="margin:0;background:#000;"><iframe src="${url}" style="border:none;width:100vw;height:100vh;" allowfullscreen></iframe></body></html>`); win.document.close(); } }
        function loadRegistry() { fetch('games.json').then(res => res.json()).then(games => { const loading = document.getElementById('loading'); if (loading) loading.remove(); games.forEach(game => { const card = document.createElement('article'); card.className = 'game-card'; const url = gameUrl(game); const thumbPath = game.image ? gameUrl({path: game.image}) : ''; card.innerHTML = `${game.image ? `<img src="${thumbPath}" class="game-thumb" alt="">` : '<div class="game-thumb" style="background:#000; display:grid; place-items:center;">No Image</div>'}<div class="game-title">${game.name}</div><div class="card-actions"><button class="play-btn" onclick="window.location.href='${url}'">Play</button><button class="blank-btn" onclick="openBlank('${url}')">Blank</button></div>`; grid.appendChild(card); cards.push({ element: card, name: game.name.toLowerCase() }); }); }); }

        if (sessionStorage.getItem(unlockKey) === 'true') { showGames(); loadRegistry(); showUpdatesOnce(); }
        searchInput.addEventListener('input', (e) => { const val = e.target.value.toLowerCase(); let matches = 0; cards.forEach(c => { const show = c.name.includes(val); c.element.style.display = show ? 'flex' : 'none'; if (show) matches++; }); noResults.style.display = matches === 0 ? 'block' : 'none'; });
    </script>
</body>
</html>
