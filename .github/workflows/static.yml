name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Inject Game Password
        run: |
          sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py

      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true

      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site

          # Stage a separate Pages-only copy. Never modify the source files used
          # by the Cloudflare site.
          rsync -a \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re
          import json

          root = Path('_site/pages/lessons')
          if not root.exists():
              raise SystemExit('Missing Pages lessons directory')

          # GitHub Pages is served from /cosmic. Only rewrite real HTML/CSS
          # resource attributes. Do NOT rewrite JavaScript source strings.
          text_extensions = {'.html', '.htm', '.css', '.svg'}
          html_root = re.compile(
              r'(\b(?:src|href|action|poster|data-src|data-url)\s*=\s*["\'])/(?!/|cosmic/|https?://)',
              re.IGNORECASE
          )
          css_root = re.compile(r'url\((?!["\']?//)(?!["\']?/cosmic/)')

          # Inline Home control for normal game pages. It is intentionally added
          # at the end of <body>, after the game's own loader has been declared.
          normal_guard = '''<script id="cosmic-pages-home-inline">(function(){function home(){var p=location.pathname,m='/pages/lessons/',i=p.indexOf(m);return location.origin+(i>=0?p.slice(0,i):'/cosmic')+m+'lessons.html'}function add(){if(!document.documentElement)return;var b=document.getElementById('cosmic-pages-home-inline-button');if(!b){b=document.createElement('button');b.id='cosmic-pages-home-inline-button';b.type='button';b.textContent='← Home';b.onclick=function(){location.href=home()};(document.body||document.documentElement).appendChild(b)}b.style.cssText='position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;font:700 14px system-ui,sans-serif!important;cursor:pointer!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important'}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});else add();})();</script>'''

          # Smash Karts replaces the entire document through document.write().
          # Inject the Home control into the string that Smash writes, without
          # touching its JavaScript logic or changing the source/Cloudflare copy.
          smash_guard = '''<script>(function(){function home(){var p=location.pathname,m='/pages/lessons/',i=p.indexOf(m);return location.origin+(i>=0?p.slice(0,i):'/cosmic')+m+'lessons.html'}function add(){if(!document.documentElement)return;var b=document.getElementById('cosmic-smash-home');if(!b){b=document.createElement('button');b.id='cosmic-smash-home';b.type='button';b.textContent='← Home';b.onclick=function(){location.href=home()};(document.body||document.documentElement).appendChild(b)}b.style.cssText='position:fixed!important;top:12px!important;left:12px!important;z-index:2147483647!important;display:block!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;padding:8px 14px!important;border:2px solid #2dccff!important;border-radius:10px!important;background:#0d1a21!important;color:#2dccff!important;font:700 14px system-ui,sans-serif!important;cursor:pointer!important;box-shadow:0 4px 16px rgba(0,0,0,.55)!important'}add();})();</script>'''
          smash_guard_literal = json.dumps(smash_guard)[1:-1].replace('</script>', '<\\/script>')
          smash_marker = '\\r\\n<\\/body>\\r\\n<\\/html>");'

          changed_files = 0
          changed_games = 0
          guard_injected = 0
          smash_fixed = 0

          for game_dir in root.iterdir():
              if not game_dir.is_dir() or game_dir.name in {'apps'}:
                  continue
              game_changed = False
              is_smash = game_dir.name.lower() == 'smash karts (may not work at school)'

              for path in game_dir.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_extensions:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue

                  original = text
                  text = html_root.sub(r'\1/cosmic/', text)
                  text = css_root.sub('url(/cosmic/', text)

                  if path.name.lower() == 'index.html':
                      if is_smash:
                          # Remove previous generated controls if a game source
                          # already contains one, then add exactly one to the
                          # document.write HTML payload.
                          text = re.sub(r'<script id="cosmic-pages-game-guard"[^>]*></script>', '', text, flags=re.IGNORECASE)
                          text = re.sub(r'<script id="cosmic-smash-home"[^>]*>.*?</script>', '', text, flags=re.IGNORECASE | re.DOTALL)
                          text = re.sub(r'<script id="cosmic-pages-home-inline"[^>]*>.*?</script>', '', text, flags=re.IGNORECASE | re.DOTALL)
                          if 'cosmic-smash-home' not in text and smash_marker in text:
                              text = text.replace(smash_marker, '\\r\\n' + smash_guard_literal + '\\r\\n<\\/body>\\r\\n<\\/html>");', 1)
                              smash_fixed += 1
                      else:
                          # Remove old generated guards and add the non-invasive
                          # version at the end of the page.
                          text = re.sub(r'<script id="cosmic-pages-game-guard"[^>]*></script>', '', text, flags=re.IGNORECASE)
                          if 'cosmic-pages-home-inline' not in text:
                              if re.search(r'</body>', text, flags=re.IGNORECASE):
                                  text = re.sub(r'</body>', normal_guard + '</body>', text, count=1, flags=re.IGNORECASE)
                              else:
                                  text += normal_guard
                              guard_injected += 1

                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed_files += 1
                      game_changed = True

              if game_changed:
                  changed_games += 1

          print(f'Rewrote Pages resources in {changed_files} files across {changed_games} games')
          print(f'Injected non-invasive Pages Home button into {guard_injected} normal game pages')
          print(f'Applied Smash Karts document.write Home fix to {smash_fixed} game pages')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
