	var gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/Vrkids2009/snowrider3d@6b7c2b9167b592528b221428414e63f06c4640b9/Build/SnowRider3D-gd-1.json", {onProgress: UnityProgress,Module:{onRuntimeInitialized: function() {UnityProgress(gameInstance, "complete")}}});

<script id="cosmic-game-runtime-loader">
(() => {
  const root = location.hostname.endsWith('.github.io') ? '/cosmic/' : '/';
  const files = [
    'scripts/game-guard.js?v=guard',
    'scripts/cosmic-wrapper-controls.js?v=wrapper-v5',
    'scripts/cosmic-global-state.js?v=global-state-v5',
    'scripts/cosmic-dev-tools.js?build=dev-commands-v5'
  ];
  for (const file of files) {
    const script = document.createElement('script');
    script.src = root + file;
    script.async = false;
    (document.body || document.documentElement).appendChild(script);
  }
})();
</script>
