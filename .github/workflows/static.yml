name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
    # Triggers when anything in the lessons folder changes (new folder, new image, etc.)
    paths:
      - 'pages/lessons/**'
      - 'scripts/generate-game-registry.py'

  workflow_dispatch:

permissions:
  contents: write # Essential for the bot to "type" the code into games.json
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Runs your script to scan folders and create the JSON
      - name: Generate game registry
        run: python3 scripts/generate-game-registry.py

      # 2. Automatically commits the new games.json back to your repo
      - name: Commit games.json changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of games.json [skip ci]"
          file_pattern: 'pages/lessons/games.json'
          skip_dirty_check: false 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
