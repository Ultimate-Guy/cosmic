<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>1 On 1 Soccer</title>
  <style>
    html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; width:100%; }
    #game { width:100%; height:100%; }
    ruffle-player { width:100%; height:100%; display:block; background:#000; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('game');
      const ruffle = window.RufflePlayer?.newest();
      if (!ruffle) { container.textContent = 'Ruffle failed to load.'; return; }
      const player = ruffle.createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';
      container.appendChild(player);
      player.load('https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@4b485142cbb1f542e00dd4444b6593f3bce7fcf3/1on1soccer_24.swf');
    });
  </script>
</body>
</html>
