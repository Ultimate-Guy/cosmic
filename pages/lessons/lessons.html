<!DOCTYPE html>
<html lang="en">
<head>
    <title>Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <style>
        :root { 
            --accent: #2dccff;
            --bg-dark: #070f15;
            --card-bg: rgba(13, 26, 33, 0.85);
            --border: rgba(58, 204, 255, 0.4);
            --text: #8fecff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 30px);
            background-size: 550px 550px, 350px 350px;
            color: var(--text);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --- Top Bar: Centered Title & Logo --- */
        #top-bar {
            display: flex;
            align-items: center;
            justify-content: center; /* Centers the title */
            padding: 20px 40px;
            background: rgba(13, 26, 33, 0.9);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand h1 {
            margin: 0;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(45, 204, 255, 0.6);
        }

        /* --- Settings Trigger (Top Right) --- */
        .settings-trigger {
            position: absolute;
            right: 40px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem; /* Smaller than title */
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .settings-trigger:hover { background: var(--accent); color: #000; }

        /* --- Floating Home Button (Glaxyias Style) --- */
        #back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: none;
            background: transparent;
            border: 1.5px solid var(--accent);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* --- Main Content & Fixed Grid --- */
        #main-content { padding: 40px; }
        #gamesgrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
            width: 100%;
        }
        
        .game-card { 
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px; display: flex;
            flex-direction: column; gap: 8px; transition: 0.3s;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .game-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 10px; object-fit: cover; }
        .game-thumb-placeholder { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 10px; display: grid; place-items: center; color: var(--accent); text-align: center; font-size: 0.7rem; }

        .game-title { font-weight: bold; font-size: 0.85rem; text-align: center; margin: 5px 0; }

        /* --- Re-added Action Buttons --- */
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { 
            height: 34px; border-radius: 8px; border: none; font-weight: bold; 
            cursor: pointer; font-size: 0.75rem; 
        }
        .play-btn { background: var(--accent); color: #000; }
        .blank-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        /* --- Full Screen Game Loader --- */
        #page-loader { position: fixed; inset: 0; background: #000; display: none; z-index: 500; }
        #page-loader iframe { width: 100%; height: 100%; border: none; }

        /* --- Condensed Settings Modal --- */
        #settings-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; place-items: center; z-index: 2000;
        }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 20px; width: 400px; }
        .modal-content h3 { margin-top: 0; color: var(--accent); }
        .setting-item { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        input { width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: var(--accent); border-radius: 8px; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="brand">
            <img src="../../imgs/cosmic.png" width="50" height="50" alt="Logo" />
            <h1>Cosmic</h1>
        </div>
        <button class="settings-trigger" onclick="toggleSettings()">
            <i class="fas fa-cog"></i> Settings
        </button>
    </header>

    <button id="back-home-btn" onclick="goHome()">
        ← Home
    </button>

    <main id="main-content">
        <div id="gamesgrid">
            <p id="loading">Connecting to Registry...</p>
        </div>
    </main>

    <section id="page-loader">
        <iframe id="game-iframe"></iframe>
    </section>

    <!-- Unified Settings Pop-up -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3>Cosmic Settings</h3>
            <div class="setting-item">
                <label>Panic Key</label>
                <input type="text" id="panic-key" placeholder="Default: \" maxlength="1" />
            </div>
            <div class="setting-item">
                <label>Panic URL</label>
                <input type="text" id="panic-url" placeholder="https://classroom.google.com" />
            </div>
            <div class="setting-item">
                <label>Tab Cloaking</label>
                <button class="play-btn action-btn" style="height:38px; margin-bottom:5px" onclick="mask('Google Classroom', 'https://ssl.gstatic.com/classroom/favicon.png')">Mask as Classroom</button>
                <button class="play-btn action-btn" style="height:38px" onclick="mask('Google', 'https://www.google.com/favicon.ico')">Mask as Google</button>
            </div>
            <button class="play-btn action-btn" style="width:100%; height:45px; margin-top:10px" onclick="toggleSettings()">Save & Close</button>
        </div>
    </div>

    <script>
        // Fix for "Games aren't loading": Using robust pathing
        function normalizeUrl(url) { return new URL(url, window.location.href).href; }
        function gameUrl(game) { return normalizeUrl('../../' + game.path + (game.entry || '')); }

        function launch(url) {
            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('page-loader').style.display = 'block';
            document.getElementById('back-home-btn').style.display = 'block';
            document.getElementById('game-iframe').src = url;
        }

        function goHome() {
            document.getElementById('top-bar').style.display = 'flex';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('page-loader').style.display = 'none';
            document.getElementById('back-home-btn').style.display = 'none';
            document.getElementById('game-iframe').src = '';
        }

        function toggleSettings() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
        }

        // Functional Settings Logic
        function mask(title, icon) {
            document.title = title;
            let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon'; link.rel = 'shortcut icon'; link.href = icon;
            document.getElementsByTagName('head').appendChild(link);
        }

        window.addEventListener('keydown', (e) => {
            const pk = document.getElementById('panic-key').value || '\\';
            const pu = document.getElementById('panic-url').value || 'https://classroom.google.com';
            if (e.key === pk) window.location.replace(pu);
        });

        function openBlank(url) {
            const win = window.open('about:blank', '_blank');
            if (!win) return;
            win.document.write('<!DOCTYPE html><html><body style="margin:0;background:#000;"><iframe src="'+url+'" style="border:none;width:100vw;height:100vh;" allowfullscreen></iframe></body></html>');
            win.document.close();
        }

        // Correct fetch for Local Registry
        fetch('games.json')
            .then(res => res.json())
            .then(games => {
                const grid = document.getElementById('gamesgrid');
                document.getElementById('loading').remove();
                games.forEach(game => {
                    const card = document.createElement('article');
                    card.className = 'game-card';
                    const finalUrl = gameUrl(game);
                    const imgUrl = game.image ? gameUrl({path: game.image}) : null;

                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}" class="game-thumb">` : `<div class="game-thumb-placeholder">${game.name}</div>`}
                        <div class="game-title">${game.name}</div>
                        <div class="card-actions">
                            <button class="action-btn play-btn" onclick="launch('${finalUrl}')">Play</button>
                            <button class="action-btn blank-btn" onclick="openBlank('${finalUrl}')">Blank</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
    </script>
</body>
</html>
