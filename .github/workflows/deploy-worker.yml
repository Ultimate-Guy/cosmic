name: Deploy Cosmic Worker

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker and upload runtime secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          secrets: |
            COSMIC_ADMIN_PASSWORD
        env:
          COSMIC_ADMIN_PASSWORD: ${{ secrets.COSMIC_ADMIN_PASSWORD }}
