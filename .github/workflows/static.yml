name: Deploy static content to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Inject Game Password
        run: |
          sed -i 's/PASSWORD_PLACEHOLDER/${{ secrets.PASSWORD_FOR_GAMES_UNLOCK }}/g' pages/lessons/lessons.html

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game registry and clean legacy injections
        run: python3 scripts/generate-game-registry.py

      - name: Commit generated registry and game cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Clean legacy game injections and update registry [skip ci]"
          file_pattern: 'pages/lessons/**'
          skip_dirty_check: false
          skip_fetch: true

      - name: Prepare GitHub Pages files
        run: |
          rm -rf _site
          mkdir -p _site

          # Stage a separate Pages-only copy. Do not use `cp -a . _site` here:
          # that attempts to copy _site into itself and makes the build fail.
          rsync -a \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            ./ _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site/pages/lessons')
          if not root.exists():
              raise SystemExit('Missing Pages lessons directory')

          # GitHub Pages is served from /cosmic. Keep the Cloudflare/source copy
          # completely untouched and only adapt the Pages deployment copy.
          #
          # Some games put root-relative asset URLs directly in HTML, while
          # others put them in local JS/CSS files. Rewrite both so a game loaded
          # from /cosmic/pages/lessons/<game>/ can still resolve /assets, /js,
          # /css, /imgs, etc. inside the GitHub Pages project.
          text_extensions = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.css', '.json', '.svg'
          }
          quoted_root = re.compile(r'(["\'])/(?!/|cosmic/|https?://)')
          css_root = re.compile(r'url\((?![\"\']?//)(?![\"\']?/cosmic/)')

          changed_files = 0
          changed_games = 0

          for game_dir in root.iterdir():
              if not game_dir.is_dir():
                  continue
              game_changed = False
              for path in game_dir.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_extensions:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue

                  original = text
                  text = quoted_root.sub(r'\1/cosmic/', text)
                  text = css_root.sub('url(/cosmic/', text)

                  if text != original:
                      path.write_text(text, encoding='utf-8')
                      changed_files += 1
                      game_changed = True

              if game_changed:
                  changed_games += 1

          print(f'Rewrote root-relative game resources in {changed_files} files across {changed_games} games')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
