name: Dynamic Wordlist Auto-Updater

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moderator-wordlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update moderator.js from the maintained blocklist
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path("scripts/moderator-blocklist.json")
          target = Path("scripts/moderator.js")
          words = json.loads(source.read_text(encoding="utf-8"))
          if not isinstance(words, list) or not words:
              raise SystemExit("Blocklist must be a non-empty JSON array.")
          words = list(dict.fromkeys(
              word.strip() for word in words
              if isinstance(word, str) and word.strip()
          ))
          if not words:
              raise SystemExit("Blocklist has no usable words.")
          js_array = json.dumps(words, ensure_ascii=False)
          content = target.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"^\s*const DEFAULT_BLOCKLIST = \[.*?\];\s*$",
              "    const DEFAULT_BLOCKLIST = " + js_array + ";",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Could not find exactly one DEFAULT_BLOCKLIST declaration.")
          target.write_text(updated, encoding="utf-8")
          print(f"Updated moderator.js with {len(words)} unique terms.")
          PY
          node --check scripts/moderator.js
          node - <<'JS'
          const moderator = require('./scripts/moderator.js');
          if (!moderator || typeof moderator.clean !== 'function') process.exit(1);
          const result = moderator.clean('proxy');
          if (!result.isFlagged) process.exit(2);
          console.log('Moderator smoke test passed.');
          JS

      - name: Commit and Push Changes to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- scripts/moderator.js; then
            echo "moderator.js already matches the maintained blocklist."
            exit 0
          fi
          git add scripts/moderator.js
          git commit -m "chore: sync Cosmic moderation blocklist [skip ci]"
          git push origin HEAD:master
