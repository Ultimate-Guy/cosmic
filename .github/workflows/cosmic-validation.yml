name: Cosmic validation
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate registries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for f in [Path('pages/lessons/games.json'), Path('apps/apps.json')]:
              data=json.loads(f.read_text())
              assert isinstance(data,list), f'{f} must contain an array'
              names=[str(x.get('name','')).strip().lower() for x in data]
              assert all(names), f'{f} contains an item without a name'
              assert len(names)==len(set(names)), f'{f} contains duplicate names'
          print('Cosmic registries are valid.')
          PY
      - name: Check core files
        run: |
          test -f index.html
          test -f cosmic-hub.html
          test -f cosmic-hub.css
          test -f pages/lessons/lessons.html
          test -f pages/lessons/game-shell.html
          echo "Core Cosmic files are present."

  browser-smoke:
    name: Browser game smoke test
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install browser test tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test representative deployed games
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const games = [
            ['Snow Rider 3D','https://cosmicv2.v75ultimate.workers.dev/pages/lessons/Snow%20Rider%203D/index.html'],
            ['2048','https://cosmicv2.v75ultimate.workers.dev/pages/lessons/2048/index.html'],
            ['A Dance of Fire and Ice','https://cosmicv2.v75ultimate.workers.dev/pages/lessons/A%20Dance%20of%20Fire%20and%20Ice/index.html']
          ];
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});
            try {
              for (const [name,url] of games) {
                const page = await browser.newPage({viewport:{width:1365,height:768}});
                const errors = [];
                const failed = [];
                page.on('console', msg => { if (msg.type()==='error') errors.push(msg.text()); });
                page.on('pageerror', err => errors.push('PAGEERROR: '+err.message));
                page.on('requestfailed', req => failed.push(req.url()+' :: '+(req.failure()?.errorText||'failed')));
                const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(10000);
                const state = await page.evaluate(() => ({
                  status: document.readyState,
                  canvasCount: document.querySelectorAll('canvas').length,
                  canvases: [...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height,clientW:c.clientWidth,clientH:c.clientHeight})),
                  bodyText: (document.body?.innerText||'').slice(0,500),
                  background: getComputedStyle(document.body).backgroundColor
                }));
                console.log(JSON.stringify({name,url,status:response?.status(),state,errors,failed},null,2));
                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE
