name: Cosmic PR release checks

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-worker:
    name: Static integrity, JavaScript syntax, and Wrangler dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate staged registry and Deployment Shield
        run: |
          set -euo pipefail
          # The production workflow injects the shared platform scripts into lessons.html
          # while preparing _site. Reproduce that relevant staging step before running
          # Deployment Shield; calling it against an untouched source tree is a false failure.
          python3 - <<'PY'
          from pathlib import Path
          page = Path('pages/lessons/lessons.html')
          source = page.read_text(encoding='utf-8')
          scripts = [
              'cosmic-runtime.js', 'cosmic-spaces.js', 'cosmic-cloud-profile.js',
              'cosmic-foundry.js', 'cosmic-compatibility.js',
              'cosmic-deployment-shield.js', 'cosmic-events.js', 'cosmic-rooms.js',
              'cosmic-runtime-manifest.js', 'cosmic-platform.js'
          ]
          tags = [f'<script src="../../scripts/{name}"></script>' for name in scripts]
          missing = [tag for tag in tags if tag not in source]
          if missing:
              marker = source.lower().rfind('</body>')
              if marker < 0:
                  raise SystemExit('Cannot stage Deployment Shield input: lessons.html has no </body>')
              source = source[:marker] + '\n'.join(missing) + '\n' + source[marker:]
              page.write_text(source, encoding='utf-8')
          PY
          python3 scripts/deployment-shield.py .
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          local = json.loads(Path('pages/lessons/games.json').read_text())
          ugs = json.loads(Path('pages/lessons/ugs-games.json').read_text())
          apps = json.loads(Path('apps/apps.json').read_text())
          for label, items in [('local games', local), ('UGS games', ugs), ('apps', apps)]:
              names = [str(x.get('name', '')).strip().casefold() for x in items]
              assert names and all(names), f'{label} contains missing names'
              assert len(names) == len(set(names)), f'{label} contains duplicate names'
          norm = lambda x: re.sub(r'[^a-z0-9]', '', str(x or '').casefold())
          local_names = {norm(x.get('name')) for x in local}
          assert not any(norm(x.get('name')) in local_names for x in ugs), 'UGS duplicates a local Cosmic game'
          blocked = {'games', 'npm', 'esm', 'codeorgugs', 'unpkg'}
          assert not any(norm(x.get('name')) in blocked for x in ugs), 'blocked placeholder remains in UGS registry'
          revisions = {str(x.get('revision', '')) for x in ugs if x.get('source') == 'UGS'}
          assert revisions and all(re.fullmatch(r'[a-f0-9]{40}', x, re.I) for x in revisions), 'UGS source revision is not immutable'
          print(f'Registries PASS: local={len(local)}, UGS={len(ugs)}, apps={len(apps)}, pinned revisions={len(revisions)}')
          PY

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check worker.js
          node --check sw.js
          node --check scripts/cosmic-required-account.js
          node --check scripts/moderator.js
          node --check scripts/validate-game-iframes.mjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.external = any(k.lower() == 'src' for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      source = ''.join(self.current)
                      if source.strip(): self.items.append(source)
                      self.in_script = False
                      self.external = False
          files = ['cosmic-studio.html', 'pages/lessons/game-shell.html', 'pages/lessons/lessons.html']
          count = 0
          for name in files:
              parser = Scripts()
              parser.feed(Path(name).read_text(encoding='utf-8'))
              for source in parser.items:
                  count += 1
                  Path(f'/tmp/cosmic-inline-{count}.js').write_text(source, encoding='utf-8')
          print(f'Extracted {count} inline script(s) from critical HTML pages.')
          PY
          for file in /tmp/cosmic-inline-*.js; do node --check "$file"; done

      - name: Test extension manifest validation and origin isolation
        run: |
          set -euo pipefail
          node --check scripts/test-cosmic-extension-runtime.mjs
          node scripts/test-cosmic-extension-runtime.mjs

      - name: Verify offline cache isolation and API wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sw = Path('sw.js').read_text()
          studio = Path('cosmic-studio.html').read_text()
          worker = Path('worker.js').read_text()
          shell = Path('pages/lessons/game-shell.html').read_text()
          assert "key.startsWith('cosmic-shell-') && key !== CACHE" in sw, 'activation must prune only Cosmic shell caches'
          assert 'cosmic-offline-packs-v1' in studio, 'offline pack cache missing'
          for route in ['/api/community/submissions','/api/community/reviews','/api/source-lockfiles','/api/admin/community/queue','/api/accounts/data','/api/accounts/revoke-sessions','/api/accounts/delete','/api/extensions/source-audit']:
              assert route in studio, f'Studio route missing: {route}'
              assert route in worker, f'Worker route missing: {route}'
          assert 'readLimitedJson' in worker and 'consumeRateLimit' in worker, 'server request caps or rate limits missing'
          assert 'auditGithubExtensionSource' in worker and 'source-commit-not-found' in worker, 'pinned extension source audit missing'
          assert 'pinned-jsdelivr-entry-required' in worker and 'extension-entry-not-pinned-to-audited-source' in worker, 'catalog entry is not bound to the scanned commit'
          assert 'body.source_reviewed!==true' in worker and 'source_commit_confirmation' in worker, 'manual source review approval gate missing'
          assert 'catalog' in worker and 'moderator-approved-metadata-static-scan-advisory-not-code-audited' in worker, 'moderated extension catalog missing'
          assert 'cdn.jsdelivr.net/gh/owner/repo@FULL_40_CHAR_SHA/extension.html' in studio, 'catalog source pin instructions missing'
          assert 'iframe' in shell and 'id="touch-controls"' in shell, 'touch overlay missing'
          assert 'frame.contentWindow.location.origin===location.origin' in shell, 'touch key injection must stay same-origin only'
          assert "pressed.set(action,{button,info})" in shell, 'touch press/release mapping must be stable'
          print('Offline cache, extension catalog/source scan, touch overlay, and API wiring checks passed.')
          PY

      - name: Wrangler bundle dry run
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
