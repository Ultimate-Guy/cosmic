<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apes vs. Helium</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#000}
  </style>
</head>
<body>
  <iframe
    src="https://drive.google.com/file/d/1IMasZ7CqN16Thlfe4Qs8ddl3g6_oDRON/preview"
    title="Apes vs. Helium"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen></iframe>

<script id="cosmic-game-runtime-loader">
(() => {
  const root = location.hostname.endsWith('.github.io') ? '/cosmic/' : '/';
  const files = [
    'scripts/game-guard.js?v=guard',
    'scripts/cosmic-wrapper-controls.js?v=wrapper-v5',
    'scripts/cosmic-global-state.js?v=global-state-v5',
    'scripts/cosmic-dev-tools.js?build=dev-commands-v5'
  ];
  for (const file of files) {
    const script = document.createElement('script');
    script.src = root + file;
    script.async = false;
    (document.body || document.documentElement).appendChild(script);
  }
})();
</script>
</body>
</html>
