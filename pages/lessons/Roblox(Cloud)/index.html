<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Roblox via Cosmic Hub</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00ff9d;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        p {
            color: #8a8f98;
            font-size: 0.9rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <h2>Routing to Unblocked Cloud Stream...</h2>
        <p>Connecting to nowgg.fun instance</p>
    </div>

    <script>
        // Directly route the top window to the unblocked platform instance
        // This avoids iframe SAMEORIGIN blocking completely
        setTimeout(function() {
            window.location.href = "https://nowgg.fun";
        }, 1000);
    </script>
</body>
</html>
