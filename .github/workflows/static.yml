name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write 
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # This is critical: it cancels any old builds so your newest games go live first.
  cancel-in-progress: true 

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # LIGHTNING SPEED: Only fetches the latest commit, not the whole history.
          fetch-depth: 1 

      - name: Sync with Remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game registry
        # Scans your folders and builds the games.json registry.
        run: python3 scripts/generate-game-registry.py

      - name: Commit changes safely
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated update of games.json [skip ci]"
          file_pattern: 'pages/lessons/games.json'
          # FIXED: These settings ensure the workflow doesn't fail if there's nothing to commit.
          skip_dirty_check: false
          skip_fetch: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
