<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cosmic</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070f15;
      color: #8fecff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      width: min(520px, 92vw);
      padding: 28px;
      border: 1px solid #3accff66;
      border-radius: 18px;
      background: #0d1a21;
      box-shadow: 0 12px 40px #0008;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 18px;
      opacity: .9;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      height: 48px;
      padding: 0 26px;
      border: 0;
      border-radius: 999px;
      background: #2dccff;
      color: #031721;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #60dcff;
    }
    .link {
      display: block;
      margin-top: 14px;
      color: #8fecff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Cosmic</h1>
    <p>Launch site in cloak mode</p>
    <div class="btn-group">
      <button id="launchBlank">About:Blank Cloak</button>
      <button id="launchBlob">Blob Cloak</button>
    </div>
    <a class="link" href="pages/lessons/lessons.html">Open without cloak</a>
  </main>

  <script>
    const targetPath = 'pages/lessons/lessons.html';

    // Generates the raw HTML structure used inside the cloaking containers
    function getCloakHTML(targetUrl) {
      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe allowfullscreen src="${targetUrl}"></iframe>
</body>
</html>`;
    }

    // 1. About:Blank Cloaking
    document.getElementById('launchBlank').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const win = window.open('about:blank', '_blank');
      if (!win) return;
      
      win.document.open();
      win.document.write(getCloakHTML(target));
      win.document.close();
      
      window.location.replace('https://www.google.com');
    });

    // 2. Blob URL Cloaking
    document.getElementById('launchBlob').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const htmlContent = getCloakHTML(target);
      
      // Create a blob containing the HTML document and generate a unique blob:// URL
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      
      const win = window.open(blobUrl, '_blank');
      if (!win) return;
      
      window.location.replace('https://www.google.com');
    });
  </script>
</body>
</html>
