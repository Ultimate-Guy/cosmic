<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cosmic</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      /* Base background color from original sources */
      background-color: #070f15; 
      /* CSS Starfield Implementation */
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
        radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
        radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
      background-size: 550px 550px, 350px 350px, 250px 250px;
      background-position: 0 0, 40px 60px, 130px 270px;
      color: #8fecff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .full-screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      /* Slightly transparent background so stars show through */
      background: rgba(13, 26, 33, 0.85); 
      text-align: center;
      width: 100%;
    }

    /* Big font for the top welcome message */
    h1 {
      margin: 0 0 20px;
      font-size: 5rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #3accff;
      /* Subtle glow to match space theme */
      text-shadow: 0 0 20px rgba(58, 204, 255, 0.6);
    }

    p {
      margin: 0 0 40px;
      font-size: 1.5rem;
      opacity: .9;
    }

    .btn-group {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1000px;
    }

    /* Buttons remain way bigger */
    button {
      flex: 1;
      min-width: 300px;
      height: 120px;
      padding: 0 40px;
      border: 2px solid #3accff66;
      border-radius: 20px;
      background: #2dccff;
      color: #031721;
      font-size: 2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #60dcff;
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(45, 204, 255, 0.4);
    }

    /* Bigger "continue without cloak" link */
    .link {
      display: block;
      margin-top: 50px;
      font-size: 2rem;
      color: #8fecff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .link:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="full-screen-container">
    <h1>Welcome to Cosmic</h1>
    <p>Launch site in cloak mode</p>
    
    <div class="btn-group">
      <button id="launchBlank">About:Blank Cloak</button>
      <button id="launchBlob">Blob Cloak</button>
    </div>

    <a class="link" href="pages/lessons/lessons.html">Open without cloak</a>
  </main>

  <script>
    const targetPath = 'pages/lessons/lessons.html';

    function getCloakHTML(targetUrl) {
      return `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe allowfullscreen src="${targetUrl}"></iframe>
</body>
</html>`;
    }

    document.getElementById('launchBlank').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const win = window.open('about:blank', '_blank');
      if (!win) return;
      win.document.open();
      win.document.write(getCloakHTML(target));
      win.document.close();
      window.location.replace('https://www.google.com');
    });

    document.getElementById('launchBlob').addEventListener('click', () => {
      const target = new URL(targetPath, window.location.href).href;
      const htmlContent = getCloakHTML(target);
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const blobUrl = URL.createObjectURL(blob);
      const win = window.open(blobUrl, '_blank');
      if (!win) return;
      window.location.replace('https://www.google.com');
    });
  </script>
</body>
</html>
